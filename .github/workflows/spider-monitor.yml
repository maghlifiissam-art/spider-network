name: Spider Monitor

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write          # allow committing the log back

jobs:
  run-spiders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run spider cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python monitor.py \
            --task "أنشئ تقريراً موجزاً لتخصصك: أهم الترندات والفرص الحالية واقتراح تنفيذي واحد."

      - name: Commit spider log
        run: |
          git config user.name "spider-bot"
          git config user.email "spider-bot@users.noreply.github.com"
          git add data/spider_log.json
          git commit -m "chore: spider log update [skip ci]" || echo "No log changes"
          git push
