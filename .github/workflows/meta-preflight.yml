name: Meta GET-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-preflight
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: meta-preflight
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify saved credentials with GET requests only
        env:
          META_APP_ID: ${{ vars.META_APP_ID }}
          META_PAGE_TOKEN_ENV_MAP: ${{ vars.META_PAGE_TOKEN_ENV_MAP }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_NEXA_ATELIER_PAGE_TOKEN: ${{ secrets.META_NEXA_ATELIER_PAGE_TOKEN }}
          META_NEXA_STORIES_PAGE_TOKEN: ${{ secrets.META_NEXA_STORIES_PAGE_TOKEN }}
        run: python3 scripts/meta_preflight.py
