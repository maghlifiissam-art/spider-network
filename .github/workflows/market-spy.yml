name: Market Spy + Bullet - demand research

on:
  workflow_dispatch:
    inputs:
      geography:
        description: 'Two-letter country code; US default. Research only, not sales ranking.'
        required: false
        default: 'US'
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  demand-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Research public demand signals and assess with Bullet
        env:
          GEO: ${{ inputs.geography || 'US' }}
        run: |
          python3 demand_pipeline.py --geography "$GEO" --output demand_report.json
          cat demand_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: demand-research
          path: |
            demand_report.json
            demand_report.md
          if-no-files-found: error
          retention-days: 7
