name: opportunities
on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python opportunity_spider.py
      - run: |
          git config user.name "opportunity-spider"
          git config user.email "actions@users.noreply.github.com"
          git add opportunities
          git diff --cached --quiet || (git commit -m "Daily opportunities digest" && git push)
