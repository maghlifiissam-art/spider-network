# Sales Spider operations config (sales.v1). Human-edited; the pipeline itself
# stays deterministic and reads its runtime inputs from adapters/fixtures.
# NOTHING in this file enables sending, publishing, or spending.

gates:
  auto_send: false            # hard-locked in code (ReplyDraft.send_allowed is always False)
  auto_publish: false
  spending_allowed: false
  require_payment_verification: true  # a deal can only be "won" after the transfer is verified
  human_review_per_reply: true        # every customer reply stays a draft until the user approves it

products:
  - sku: labor-book-2026
    name: "قانون الشغل المغربي 2026 - دليلك العملي"
    price_mad: 30
    delivery: email_after_payment_verification   # PDF by email within 24h of verified transfer
    commission_rate: 1.0
    active: true
