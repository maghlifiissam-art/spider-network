<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eefe;color:#111;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#6d28d9}h1{margin:.2em 0}input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#e4d9fb;color:#111}.card{background:#faf7ff;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#fff}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="account.html" data-i="account"></a></p><h1 data-i="dt"></h1><div id="app">...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");
(async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const u=session.user;const{data:p}=await SB.from("profiles").select("role").eq("id",u.id).maybeSingle();
if(p?.role!=="admin"){app.textContent=T("adminonly");return}
async function draw(){const[{data:e},{data:s}]=await Promise.all([SB.from("earnings").select("*").order("created_at",{ascending:false}).limit(200),SB.from("settings").select("value").eq("key","revenue_split").maybeSingle()]);
const sp=s?.value||{creator:70,platform:30};const sum=d=>(e||[]).filter(r=>r.direction===d).reduce((a,r)=>a+Number(r.amount),0);const i=sum("in"),o=sum("out");
app.innerHTML='<div class="card"><div>'+T("inn")+': <b>'+i.toFixed(2)+' MAD</b></div><div>'+T("outt")+': <b>'+o.toFixed(2)+' MAD</b></div><div>'+T("net")+': <b>'+(i-o).toFixed(2)+' MAD</b></div></div>'+
'<div class="card"><b>'+T("split")+'</b><input id="cp" type="number" min="0" max="100" value="'+sp.creator+'"><button id="sv">'+T("save")+'</button> <span id="m1" class="muted"></span></div>'+
'<div class="card"><b>'+T("addrec")+'</b><select id="dr" style="width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0"><option value="in">'+T("dirin")+'</option><option value="out">'+T("dirout")+'</option></select><input id="sc" placeholder="'+T("src")+'"><input id="am" type="number" min="0" step="0.01" placeholder="'+T("amt")+'"><input id="nt" placeholder="'+T("note")+'"><button id="ad">'+T("addrec")+'</button> <span id="m2" class="muted"></span></div>'+
'<div class="card"><b>'+T("recent")+'</b>'+(e||[]).slice(0,30).map(r=>'<div class="muted">'+new Date(r.created_at).toLocaleDateString()+' &middot; '+(r.direction==="in"?"+":"-")+Number(r.amount).toFixed(2)+' &middot; '+esc(r.source)+(r.note?' &middot; '+esc(r.note):'')+'</div>').join("")+'</div>';
document.getElementById("sv").onclick=async()=>{const c=Math.max(0,Math.min(100,Number(cp.value)));const r=await SB.from("settings").upsert({key:"revenue_split",value:{creator:c,platform:100-c}});m1.textContent=r.error?r.error.message:T("saved")};
document.getElementById("ad").onclick=async()=>{const a=Number(am.value);if(!sc.value.trim()||!(a>0))return;const c=sp.creator/100;const isIn=dr.value==="in";
const r=await SB.from("earnings").insert({direction:dr.value,source:sc.value.trim(),amount:a,note:nt.value.trim()||null,creator_share:isIn?+(a*c).toFixed(2):0,platform_share:isIn?+(a*(1-c)).toFixed(2):0});if(r.error)m2.textContent=r.error.message;else draw()}}
draw()})();
</script></body></html>
