<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groups - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:#b08beb;color:#111;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#2e1065}h1{margin:.2em 0}input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#c4abf0;color:#111}.card{background:#c9b3f2;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#fff}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>#call{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:20}#call iframe{flex:1;border:0}</style></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="posts.html" data-i="feed"></a> &middot; <a href="account.html" data-i="account"></a></p><h1 data-i="gt"></h1><div id="app">...</div>
<div id="call"><button onclick="endCall()" data-i="gleave"></button><iframe allow="camera;microphone;fullscreen;display-capture"></iframe></div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");let me=null;
function endCall(){document.querySelector("#call iframe").src="about:blank";document.getElementById("call").style.display="none"}
function joinCall(id){document.querySelector("#call iframe").src="https://meet.jit.si/rimaz-"+id+"#config.prejoinPageEnabled=true";document.getElementById("call").style.display="flex"}
async function load(){const{data:{session}}=await SB.auth.getSession();if(!session){app.innerHTML='<a class="btn" href="account.html">'+T("signfirst")+'</a>';return}
me=session.user;
const[{data:gs},{data:ms}]=await Promise.all([SB.from("groups").select("*").order("created_at",{ascending:false}),SB.from("memberships").select("*")]);const adminG=(ms||[]).filter(m=>m.user_id===me.id&&m.status==="approved"&&m.member_role==="admin").map(m=>m.group_id);const names={};for(const g of adminG){const r=await SB.rpc("group_requests",{g});(r.data||[]).forEach(x=>names[g+"|"+x.user_id]=x.display_name)}
const mine={};(ms||[]).filter(m=>m.user_id===me.id).forEach(m=>mine[m.group_id]=m);
let h='<div class="card"><b>'+T("newg")+'</b><input id="gn" maxlength="80" placeholder="'+T("gname")+'"><textarea id="gd" rows="2" maxlength="500" placeholder="'+T("gdesc")+'"></textarea><button id="gc">'+T("gcreate")+'</button><div id="msg" class="muted"></div></div>';
h+=(gs||[]).map(g=>{const m=mine[g.id];const st=m?m.status:"none";
let x='<div class="card"><b>'+esc(g.name)+'</b><div class="muted">'+esc(g.description)+'</div>';
if(st==="none")x+='<button data-ask="'+g.id+'">'+T("ask")+'</button>';
else if(st==="pending")x+='<div class="muted">'+T("pend")+'</div>';
else if(st==="approved"){x+='<div class="muted">'+T("mem")+(m.member_role==="admin"?" (admin)":"")+'</div><button data-call="'+g.id+'">'+T("gjoin")+'</button>';
if(m.member_role==="admin"){const pd=(ms||[]).filter(r=>r.group_id===g.id&&r.status==="pending");if(pd.length)x+='<div><b>'+T("reqs")+'</b>'+pd.map(r=>'<div>'+esc(names[g.id+"|"+r.user_id]||r.user_id.slice(0,6))+' <button data-ok="'+g.id+'|'+r.user_id+'">'+T("appr")+'</button><button class="alt" data-no="'+g.id+'|'+r.user_id+'">'+T("rej")+'</button></div>').join("")+'</div>'}}
return x+'</div>'}).join("")||'<p class="muted">'+T("nog")+'</p>';
app.innerHTML=h;
document.getElementById("gc").onclick=async()=>{const n=gn.value.trim();if(!n)return;const r=await SB.from("groups").insert({name:n,description:gd.value.trim()||null,created_by:me.id});if(r.error)msg.textContent=r.error.message;else load()};
app.querySelectorAll("[data-ask]").forEach(b=>b.onclick=async()=>{await SB.from("memberships").insert({group_id:b.dataset.ask,user_id:me.id});load()});
app.querySelectorAll("[data-call]").forEach(b=>b.onclick=()=>joinCall(b.dataset.call));
app.querySelectorAll("[data-ok],[data-no]").forEach(b=>b.onclick=async()=>{const[g,u]=(b.dataset.ok||b.dataset.no).split("|");await SB.from("memberships").update({status:b.dataset.ok?"approved":"rejected"}).eq("group_id",g).eq("user_id",u);load()})}
load();
</script></body></html>
