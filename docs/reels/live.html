<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>#room{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:20}#room iframe{flex:1;border:0}.dot{color:#ff3b3b;font-weight:800}</style></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="posts.html" data-i="feed"></a> &middot; <a href="series.html" data-i="sf"></a> &middot; <a href="account.html" data-i="account"></a></p><h1><span class="dot">&#9679;</span> <span data-i="live"></span></h1><div id="app">...</div>
<div id="room"><div style="display:flex;gap:8px;padding:8px"><button class="alt" onclick="leave()" data-i="gleave"></button><button id="endb" style="display:none" onclick="endLive()" data-i="endlive"></button></div><iframe allow="camera;microphone;fullscreen;display-capture;autoplay"></iframe></div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");let me=null,cur=null;
function open_(l,host){cur=l;const hash=host?"#config.prejoinPageEnabled=false":"#config.startWithAudioMuted=true&config.startWithVideoMuted=true&config.prejoinPageEnabled=false";
document.querySelector("#room iframe").src="https://meet.jit.si/rimaz-live-"+l.id+hash;document.getElementById("room").style.display="flex";document.getElementById("endb").style.display=host?"inline-block":"none"}
function leave(){document.querySelector("#room iframe").src="about:blank";document.getElementById("room").style.display="none"}
async function endLive(){if(!cur)return;await SB.from("lives").update({status:"ended",ended_at:new Date().toISOString()}).eq("id",cur.id);leave();load()}
async function load(){const{data:{session}}=await SB.auth.getSession();me=session?.user||null;
const{data:ls}=await SB.from("lives").select("*,channels(handle,name)").eq("status","live").order("started_at",{ascending:false}).limit(50);
let ch=null;if(me){const r=await SB.from("channels").select("id,handle").eq("owner_id",me.id).maybeSingle();ch=r.data}
let h="";
if(ch)h+='<div class="card"><b>'+T("golive")+'</b><input id="lt" maxlength="120" placeholder="'+T("stitle")+'"><label class="muted"><input id="lr" type="checkbox" style="width:auto"> '+T("liverights")+'</label><button id="gl">'+T("golive")+'</button><div id="msg" class="muted"></div></div>';
else if(!me)h+='<a class="btn" href="account.html">'+T("signin")+'</a>';
h+=(ls||[]).map(l=>'<div class="card"><span class="dot">&#9679; LIVE</span> <b>'+esc(l.title)+'</b><div class="muted"><a href="channel.html?h='+encodeURIComponent(l.channels?.handle||"")+'">@'+esc(l.channels?.handle)+'</a></div><button data-j="'+l.id+'" data-o="'+l.owner_id+'">'+(me&&l.owner_id===me.id?T("resume"):T("watch"))+'</button></div>').join("")||'<p class="muted">'+T("nolive")+'</p>';
app.innerHTML=h;
const gl=document.getElementById("gl");if(gl)gl.onclick=async()=>{const t=lt.value.trim();if(!t){msg.textContent=T("stitle");return}if(!lr.checked){msg.textContent=T("needrights");return}
const r=await SB.from("lives").insert({owner_id:me.id,channel_id:ch.id,title:t}).select("*").single();if(r.error){msg.textContent=r.error.message;return}open_(r.data,true)};
app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const l=(ls||[]).find(x=>x.id===b.dataset.j);open_(l,me&&l.owner_id===me.id)})}
load();
</script></body></html>
