<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posts - Zolra</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1038;color:#fff;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#d4a017}h1{margin:.2em 0}input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff22;color:#fff}.card{background:#ffffff14;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#000}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<p><a href="index.html">&larr; Zolra</a> &middot; <a href="live.html" data-i="live"></a> &middot; <a href="series.html" data-i="sf"></a> &middot; <a href="publish.html" data-i="pub"></a> &middot; <a href="account.html" data-i="account"></a></p><h1 data-i="feed"></h1><div id="tabs"></div><div id="list">...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
let topic=new URLSearchParams(location.search).get("t")||"all";
document.getElementById("tabs").innerHTML=["all","news","courses","ads","publish"].map(k=>'<a class="btn'+(k===topic?'':' alt')+'" style="'+(k===topic?'':'background:#ffffff22;color:#fff')+'" href="?t='+k+'">'+T(k)+'</a>').join("");
(async()=>{let q=SB.from("posts").select("*,channels(handle,name)").order("created_at",{ascending:false}).limit(50);if(topic!=="all")q=q.eq("topic",topic);
const{data}=await q;document.getElementById("list").innerHTML=(data||[]).map(p=>'<div class="card"><a href="channel.html?h='+encodeURIComponent(p.channels?.handle||"")+'">@'+esc(p.channels?.handle)+'</a> <span class="muted">&middot; '+T(p.topic)+(p.is_sponsored?' &middot; Ad':'')+'</span>'+(p.title?'<h3>'+esc(p.title)+'</h3>':'')+(p.body?'<p style="white-space:pre-wrap">'+esc(p.body)+'</p>':'')+(p.kind==="video"?'<video controls playsinline preload="metadata" src="'+esc(p.media_url)+'"></video>':'')+(p.kind==="image"?'<img loading="lazy" src="'+esc(p.media_url)+'" style="width:100%;border-radius:12px">':'')+'</div>').join("")||'<p class="muted">'+T("nopost")+'</p>'})();
</script></body></html>
