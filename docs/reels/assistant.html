en:[["channel create account","Tap \"Create your channel\" in the menu, sign in with Google, then fill in handle, name and bio."],["publish post video upload","Tap the + button in the bottom bar. Choose a video, add a title and send. Videos up to 50 MB."],["store shop sell product","Open the Store page, sign in, then \"Open your store\". The first 1000 stores are free. Add products with up to 10 photos each."],["price pay payment free cost","The first 1000 stores are free for one full year, then $2 per year for life. After the first 1000: 3 months free, then $2 per year until the end of 2027; from 2028 it is $5 per year. The first 1000 members get a permanent Founding Member badge. Payment is not open yet. Ads get 500 free views."],["message dm chat","Use the Messages icon in the bottom bar, or the menu on a video, to message a channel owner."],["ads advertise sponsored","Ads appear automatically between reels in the feed. Each ad gets 500 free views, then it becomes paid (coming soon)."],["report abuse fake","Use the Report button on any store or product. The admin reviews it and can suspend or delete the store."],["password","Open Settings from the menu, then Change password."],["language arabic french darija","Use the language selector at the bottom to switch between English, French, Arabic and Darija."],["install app phone","In Chrome, open the menu and tap Add to home screen. Rimaz then opens like an app."],["privacy data","We do not collect ID cards. See Privacy in Settings."],["live stream","Open Live from the menu to watch or start a live. Only original content is allowed."]],
fr:[["chaîne creer compte","Touchez Créez votre chaîne dans le menu, connectez-vous avec Google, puis remplissez identifiant, nom et bio."],["publier video poster","Touchez + dans la barre du bas, choisissez une vidéo, ajoutez un titre et envoyez. 50 Mo maximum."],["boutique magasin vendre produit","Ouvrez la page Boutique, connectez-vous puis Ouvrez votre boutique. Les 1000 premières sont gratuites. Jusqu'à 10 photos par produit."],["prix payer paiement gratuit","Les 1000 premières boutiques sont gratuites pendant un an, puis 2 $ par an à vie. Après les 1000 premières : 3 mois gratuits, puis 2 $ par an jusqu'à fin 2027 ; dès 2028, 5 $ par an. Les 1000 premiers membres reçoivent un badge permanent de Membre fondateur. Paiement pas encore ouvert. Les pubs ont 500 vues gratuites."],["message discussion","Utilisez l'icône Messages en bas, ou le menu d'une vidéo, pour écrire à un créateur."],["pub publicité annonce","Les pubs apparaissent automatiquement entre les reels du fil. 500 vues gratuites, puis payant (bientôt)."],["signaler abus faux","Utilisez Signaler sur une boutique ou un produit. L'admin peut suspendre ou supprimer."],["mot de passe","Ouvrez Paramètres dans le menu, puis Changer le mot de passe."],["langue arabe","Utilisez le sélecteur de langue en bas."],["installer application","Dans Chrome, menu puis Ajouter à l'écran d'accueil."],["confidentialité données","Nous ne collectons pas de cartes d'identité. Voir Confidentialité."],["live direct","Ouvrez Live dans le menu. Contenu original uniquement."]],
ar:[["قناة انشاء حساب","اضغط أنشئ قناتك في القائمة، سجّل الدخول بجوجل ثم املأ المعرّف والاسم والنبذة."],["نشر فيديو رفع","اضغط زر + في الشريط السفلي، اختر فيديو وأضف عنواناً وأرسل. حتى 50 ميغا."],["متجر بيع منتج محل","افتح صفحة المتجر وسجّل الدخول ثم افتح متجرك. أول 1000 متجر مجاناً. تقدر تضيف حتى 10 صور لكل منتج."],["سعر دفع مجاني تكلفة","أول 1000 متجر مجانية لمدة سنة كاملة، ثم 2$ في السنة مدى الحياة. بعد أول 1000: 3 أشهر مجانية، ثم 2$ في السنة حتى نهاية 2027، ومن 2028 يصبح 5$ في السنة. أول 1000 عضو يحصلون على شارة العضو المؤسس بشكل دائم. الدفع غير مفتوح بعد. الإعلانات لها 500 مشاهدة مجانية."],["رسالة رسائل محادثة","استعمل أيقونة الرسائل في الشريط السفلي أو قائمة الفيديو لمراسلة صاحب قناة."],["اعلان اعلانات اشهار","تظهر الإعلانات تلقائياً بين الريلز في الصفحة الرئيسية. لكل إعلان 500 مشاهدة مجانية ثم يصبح مدفوعاً (قريباً)."],["ابلاغ بلاغ مزور احتيال","استعمل زر إبلاغ على أي متجر أو منتج. الأدمن يراجع ويمكنه تعليق المتجر أو حذفه."],["كلمة السر باسوورد","افتح الإعدادات من القائمة ثم تغيير كلمة السر."],["لغة عربية فرنسية دارجة","استعمل اختيار اللغة في الأسفل للتبديل بين الإنجليزية والفرنسية والعربية والدارجة."],["تطبيق تثبيت هاتف","في كروم افتح القائمة واضغط إضافة إلى الشاشة الرئيسية، فيفتح ريماز مثل التطبيق."],["خصوصية بيانات بطاقة","لا نجمع بطاقات الهوية. راجع الخصوصية في الإعدادات."],["بث مباشر لايف","افتح البث المباشر من القائمة. المحتوى الأصلي فقط."]],
ary:[["قناة صاوب حساب","كليكي على صاوب قناتك فالقائمة، دخل بجوجل وعمر المعرف والسمية والنبذة."],["نشر فيديو رفع","كليكي على + فالشريط الأسفل، اختار فيديو وزيد عنوان وصيفط. حتى 50 ميغا."],["متجر بيع منتوج حانوت","حل صفحة المتجر، دخل وكليكي حل متجرك. أول 1000 متجر بالمجان. تقدر تزيد حتى 10 تصاور لكل منتوج."],["ثمن خلص أداء مجاني","أول 1000 متجر بالمجان لمدة عام كامل، ومن بعد 2$ فالعام مدى الحياة. من بعد أول 1000: 3 شهور مجانية، من بعد 2$ فالعام حتى نهاية 2027، ومن 2028 كيولي 5$ فالعام. أول 1000 عضو كياخدو شارة العضو المؤسس بشكل دائم. الأداء مازال ما تحلش. الإشهارات 500 مشاهدة مجانية."],["رسالة رسائل","استعمل أيقونة الرسائل فالشريط الأسفل ولا قائمة الفيديو باش تراسل صاحب قناة."],["اشهار إعلان","الإشهارات كتبان بوحدها بين الريلز فالصفحة الرئيسية. كل إشهار 500 مشاهدة مجانية ومن بعد كيولي بالأداء (قريبا)."],["بلغ ابلاغ مزور نصب","استعمل زر بلغ على أي متجر ولا منتوج. الأدمن كيراجع وممكن يعلق المتجر ولا يمسحو."],["كلمة السر باسوورد","حل الإعدادات من القائمة وبعدها بدل كلمة السر."],["لغة عربية فرنسية دارجة","استعمل اختيار اللغة لتحت باش تبدل."],["تطبيق تثبيت تيليفون","فكروم حل القائمة وكليكي إضافة للشاشة الرئيسية، وكيتحل ريماز بحال التطبيق."],["خصوصية معطيات بطاقة","ما كنجمعوش بطائق الهوية. شوف الخصوصية فالإعدادات."],["لايف مباشر","حل لايف من القائمة. المحتوى الأصلي غير."]]};Object.assign(KB,(EXD["assistant"]||{}).KB);;
