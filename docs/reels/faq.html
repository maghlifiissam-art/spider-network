en:{h:"Frequently asked questions",s:"Plain answers. We only state what is in our Terms.",home:"<- Home",cta:"Join free",st:"Live progress",qa:[
["When do creator earnings start?","Profit sharing starts when RIMAZ reaches 1,000 creators and 10 million views together. Until both targets are reached there is no distribution. The live counter on the progress page shows the real numbers."],
["How much do creators get?","70% of net advertising revenue goes to creators and 30% to the platform. The rate is fixed. Net revenue means the money the platform actually receives from advertisers after fees, refunds and taxes on the ad service. The creators' share is split in proportion to each creator's views that month."],
["How and when can I withdraw?","Distribution is monthly with a $50 minimum payout. Smaller amounts roll over to the next month. The payout method is not published yet. It will be announced before the first distribution, and nothing is paid before the goals are reached."],
["What if 1,000 creators and 10 million views are not reached?","Then there is no payout. Our Terms do not set a deadline or a different threshold, and we do not promise any income. We will not invent a fallback: if we ever change a rule, we give 30 days' notice on the platform. Your content stays yours, and we do not require exclusivity."],
["Is it free to join?","Yes. Creating an account and a channel is free."],
["Do I need to publish only on RIMAZ?","No. No exclusivity is required. Publish original or fully licensed content only."]]},
fr:{h:"Questions fréquentes",s:"Des réponses claires. Nous n'affirmons que ce qui figure dans nos Conditions.",home:"<- Accueil",cta:"Rejoindre gratuitement",st:"Progression en direct",qa:[
["Quand commencent les revenus des créateurs ?","Le partage des profits commence lorsque RIMAZ atteint 1 000 créateurs et 10 millions de vues ensemble. Tant que les deux objectifs ne sont pas atteints, il n'y a aucune distribution. Le compteur en direct affiche les chiffres réels."],
["Combien reçoivent les créateurs ?","70 % des revenus publicitaires nets vont aux créateurs et 30 % à la plateforme. Le taux est fixe. Le revenu net est l'argent réellement reçu des annonceurs, après frais, remboursements et taxes sur le service publicitaire. La part des créateurs est répartie au prorata des vues de chacun sur le mois."],
["Comment et quand puis-je retirer mes gains ?","La distribution est mensuelle, avec un minimum de 50 $. Les montants inférieurs sont reportés au mois suivant. Le mode de paiement n'est pas encore publié. Il sera annoncé avant la première distribution, et rien n'est versé avant l'atteinte des objectifs."],
["Et si 1 000 créateurs et 10 millions de vues ne sont pas atteints ?","Alors il n'y a pas de paiement. Nos Conditions ne fixent ni date limite ni autre seuil, et nous ne promettons aucun revenu. Nous n'inventons pas de solution de repli : si une règle change, nous prévenons 30 jours à l'avance sur la plateforme. Votre contenu reste à vous et aucune exclusivité n'est exigée."],
["L'inscription est-elle gratuite ?","Oui. Créer un compte et une chaîne est gratuit."],

["متى تبدأ أرباح المبدعين؟","يبدأ تقاسم الأرباح عندما تصل ريماز إلى 1,000 مبدع و10 ملايين مشاهدة معا. وقبل بلوغ الهدفين لا يوجد أي توزيع. يعرض العداد المباشر الأرقام الحقيقية."],
["كم يحصل المبدعون؟","70% من صافي إيرادات الإعلانات للمبدعين و30% للمنصة. النسبة ثابتة. صافي الإيرادات هو ما تتلقاه المنصة فعلا من المعلنين بعد الرسوم والمبالغ المستردة والضرائب على خدمة الإعلانات. وتُقسَّم حصة المبدعين بنسبة مشاهدات كل مبدع في الشهر."],
["كيف ومتى أسحب أرباحي؟","التوزيع شهري بحد أدنى 50 دولارا، وما دونه يُرحَّل إلى الشهر التالي. طريقة الدفع لم تُنشر بعد، وسيُعلن عنها قبل أول توزيع. ولا يُدفع شيء قبل بلوغ الهدفين."],
["ماذا لو لم نصل إلى 1,000 مبدع و10 ملايين مشاهدة؟","عندها لا يوجد دفع. شروطنا لا تحدد موعدا نهائيا ولا حدا آخر، ولا نعد بأي دخل. لن نختلق بديلا: إذا غيّرنا قاعدة فسنعلن ذلك قبل 30 يوما على المنصة. محتواك يبقى ملكك، ولا نشترط الحصرية."],
["هل التسجيل مجاني؟","نعم. إنشاء الحساب والقناة مجاني."],
["هل يجب أن أنشر على ريماز فقط؟","لا. لا نشترط الحصرية. انشر محتوى أصليا أو مرخصا بالكامل فقط."]]},
