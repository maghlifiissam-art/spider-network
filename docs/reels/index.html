<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rimaz</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d28d9">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070714;color:#f1efff;font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 24px 110px;background:radial-gradient(ellipse at 25% 15%,#2b2f9a80,transparent 55%),radial-gradient(ellipse at 85% 85%,#6d28d966,transparent 55%),radial-gradient(circle at 70% 40%,#d4a0171f,transparent 30%),#070714}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.v>*:not(video){position:relative;text-shadow:0 1px 8px #000a}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d4a017;font-weight:600}
h2{font-size:32px;line-height:1.12;margin:8px 0;font-weight:700;letter-spacing:-.02em}p{font-size:16px;line-height:1.55;color:#c9c5e6;max-width:560px}
.cta{display:inline-block;margin-top:12px;background:#d4a017;color:#1a1033;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:700;width:max-content;font-size:14px;box-shadow:0 0 24px #d4a01755}
nav button{background:transparent;color:#aaa6d0;border:0;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500}nav button.on{background:#d4a017;color:#1a1033;font-weight:700}
#add{position:fixed;right:16px;bottom:64px;width:56px;height:56px;border-radius:50%;border:0;background:#d4a017;color:#1a1033;font-size:30px;z-index:5;box-shadow:0 0 28px #d4a01788}
.empty{display:grid;place-items:center;height:100dvh;color:#8d89b5}
#hd{position:fixed;top:0;left:0;right:0;z-index:5;background:#070714CC;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14;padding:8px 10px 6px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:6px;border:1.5px solid #d4a017;border-radius:12px;padding:3px 10px;flex:none}.brand b{color:#d4a017;letter-spacing:2px;font-size:14px}
.lk{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.lk a{flex:none;font-size:13px;background:#ffffff1c;color:#f1efff;padding:6px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}.lk a.mk{background:#d4a017;color:#1a1033;font-weight:700}.lk a.lv{background:#ff3b3b;color:#fff;font-weight:700}
nav{position:static;display:flex;gap:4px;padding:0;background:none;border:0;backdrop-filter:none;overflow-x:auto;scrollbar-width:none;white-space:nowrap}nav button{flex:none}
.card.v>div.rail{position:absolute}.rail{position:absolute;inset-inline-end:10px;bottom:130px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px}.rail button{width:46px;background:none;border:0;color:#f1efff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-shadow:0 1px 6px #000}.rail button>span:not(.ic):not(.n){display:none}.rail .ic{width:42px;height:42px;border-radius:50%;background:#070714b3;border:1px solid #ffffff22;display:grid;place-items:center;font-size:22px;backdrop-filter:blur(8px)}.rail .on .ic{color:#d4a017;border-color:#d4a017}.rail .fl .ic{background:#d4a017;color:#1a1033;font-weight:800}.mn{display:none;position:absolute;inset-inline-end:60px;bottom:0;background:#0c0c22f2;border:1px solid #ffffff22;border-radius:14px;padding:6px;min-width:150px}.mn.o{display:block}.mn a,.mn span{display:block;padding:10px 12px;font-size:14px;color:#f1efff;text-decoration:none;border-radius:8px;cursor:pointer}.mn a:active,.mn span:active{background:#ffffff1c}#toast{position:fixed;top:130px;left:50%;transform:translateX(-50%);background:#d4a017;color:#1a1033;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;z-index:20;display:none}
.card{padding-top:120px}
</style></head><body>
<header id="hd"><div class="r1"><div class="brand"><img src="icon.svg" alt="" width="22" height="22"><b>RIMAZ</b></div><div class="lk"><a href="account.html" class="mk" data-i="mk_title">Create your channel</a><a href="posts.html" data-i="feed">Posts</a><a href="live.html" class="lv">&#9679; <span data-i="live">Live</span></a><a href="series.html" data-i="sf">Series</a><a href="account.html" data-i="account">Account</a></div></div><nav id="nav"></nav></header><div id="feed"></div>
<div id="toast"></div><button id="add" title="Publish">+</button><input id="file" type="file" accept="video/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script><script src="i18n.js"></script><script>
const SEC=["all","news","courses","ads","publish"].map(k=>[k,T(k)]);
let items=[],cur="all";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
const SBC=window.supabase?supabase.createClient("https://eyasbfywyatrkpkljxek.supabase.co","sb_publishable_1hlN6DuTPcl-rCJufPHBZw_gAr502Jq"):null;
const saved=new Set(JSON.parse(localStorage.getItem("saved")||"[]"));
async function sess(){const{data:{session}}=await SBC.auth.getSession();return session}
async function rail(c,i,v){const r=document.createElement("div");r.className="rail";
r.innerHTML='<button class="fl" data-a="f"><span class="ic">+</span><span>'+T("follow")+'</span></button><button data-a="l"><span class="ic">&#9825;</span><span class="n">0</span></button><button data-a="s" class="'+(saved.has(i.id)?"on":"")+'"><span class="ic">&#9733;</span><span>'+T("sav")+'</span></button><button data-a="h"><span class="ic">&#8599;</span><span>'+T("shr")+'</span></button><button data-a="m"><span class="ic">&#9776;</span><span>'+T("more")+'</span></button><div class="mn"><span data-a="msg">&#9993; '+T("msgs")+'</span><a href="channel.html?h='+encodeURIComponent(i.h||"")+'">@ '+T("chan")+'</a><span data-a="snd">&#128266; '+T("snd")+'</span></div>';
c.append(r);const n=r.querySelector(".n"),lb=r.querySelector('[data-a=l]'),fb=r.querySelector('[data-a=f]');let liked=false,fol=false;
if(SBC){const{count}=await SBC.from("post_likes").select("*",{count:"exact",head:true}).eq("post_id",i.id);n.textContent=count||0;const se=await sess();if(se){const a=await SBC.from("post_likes").select("post_id").eq("post_id",i.id).eq("user_id",se.user.id);liked=!!(a.data&&a.data.length);lb.classList.toggle("on",liked);lb.querySelector(".ic").innerHTML=liked?"&#9829;":"&#9825;";const b=await SBC.from("follows").select("channel_id").eq("channel_id",i.cid).eq("follower_id",se.user.id);fol=!!(b.data&&b.data.length);if(fol){fb.classList.remove("fl");fb.classList.add("on");fb.querySelector(".ic").innerHTML="&#10003;"}}}
r.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;e.stopPropagation();const a=b.dataset.a;
if(a=="m"){r.querySelector(".mn").classList.toggle("o");return}
if(a=="msg"){toast(T("soon"));return}
if(a=="snd"){v.muted=!v.muted;return}
if(a=="h"){const u=location.origin+location.pathname.replace(/index\.html$/,"")+"channel.html?h="+encodeURIComponent(i.h||"");if(navigator.share){try{await navigator.share({title:i.t,url:u})}catch(_){}}else{try{await navigator.clipboard.writeText(u);toast(T("copied"))}catch(_){prompt("",u)}}return}
if(a=="s"){if(saved.has(i.id))saved.delete(i.id);else saved.add(i.id);localStorage.setItem("saved",JSON.stringify([...saved]));b.classList.toggle("on",saved.has(i.id));return}
const se=await sess();if(!se){location="account.html";return}
if(a=="l"){if(liked){await SBC.from("post_likes").delete().eq("post_id",i.id).eq("user_id",se.user.id);n.textContent=Math.max(0,+n.textContent-1)}else{const q=await SBC.from("post_likes").insert({post_id:i.id});if(q.error)return;n.textContent=+n.textContent+1}liked=!liked;b.classList.toggle("on",liked);b.querySelector(".ic").innerHTML=liked?"&#9829;":"&#9825;"}
if(a=="f"){if(fol){await SBC.from("follows").delete().eq("channel_id",i.cid).eq("follower_id",se.user.id);fol=false;b.classList.remove("on");b.classList.add("fl");b.querySelector(".ic").innerHTML="+"}else{const q=await SBC.from("follows").insert({channel_id:i.cid,follower_id:se.user.id});if(q.error)return;fol=true;b.classList.remove("fl");b.classList.add("on");b.querySelector(".ic").innerHTML="&#10003;"}}}}

const db=new Promise(r=>{const q=indexedDB.open("reels",1);q.onupgradeneeded=()=>q.result.createObjectStore("v",{autoIncrement:true});q.onsuccess=()=>r(q.result)});
async function mine(){const d=await db;return new Promise(r=>{const o=d.transaction("v").objectStore("v").getAll();o.onsuccess=()=>r(o.result)})}
async function load(){const f=await (await fetch("feed.json")).json();const m=await mine();let rv=[];try{const c=supabase.createClient("https://eyasbfywyatrkpkljxek.supabase.co","sb_publishable_1hlN6DuTPcl-rCJufPHBZw_gAr502Jq");const{data}=await c.from("posts").select("id,title,body,media_url,topic,channel_id,channels(handle)").eq("kind","video").order("created_at",{ascending:false}).limit(20);rv=(data||[]).map(p=>({s:"publish",t:p.title||"@"+(p.channels?.handle||""),b:(p.body||"")+(p.channels?.handle?"  @"+p.channels.handle:""),vurl:p.media_url,h:p.channels?.handle,id:p.id,cid:p.channel_id}))}catch(e){}items=[...rv,...m.map(b=>({s:"publish",t:"My reel",b:"",blob:b})),...f];render()}
function render(){const el=document.getElementById("feed");el.innerHTML="";const l=items.filter(i=>cur=="all"||i.s==cur);
if(!l.length){el.innerHTML='<div class="empty">Nothing here yet</div>';return}
l.forEach(i=>{const c=document.createElement("section");c.className="card";if(i.blob||i.vurl)c.classList.add("v");
if(i.blob){const v=document.createElement("video");v.src=URL.createObjectURL(i.blob);v.loop=true;v.muted=true;v.playsInline=true;c.append(v)}
if(i.vurl){const v=document.createElement("video");v.src=i.vurl;v.loop=true;v.muted=true;v.playsInline=true;v.preload="metadata";v.onclick=()=>{v.muted=!v.muted};c.append(v);if(i.id)rail(c,i,v)}
c.insertAdjacentHTML("beforeend",`<div class="tag">${i.s}</div><h2></h2><p></p>`);c.querySelector("h2").textContent=i.t;c.querySelector("p").textContent=i.b;
if(i.u)c.insertAdjacentHTML("beforeend",`<a class="cta" target="_blank" rel="noopener" href="${i.u}">Open</a>`);el.append(c)});
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(v)e.isIntersecting?v.play():v.pause()}),{threshold:.6});el.querySelectorAll(".card").forEach(c=>io.observe(c))}
document.getElementById("nav").innerHTML=SEC.map(([k,n])=>`<button data-k="${k}" class="${k==cur?"on":""}">${n}</button>`).join("")+`<button onclick="location='groups.html'">Groups</button><button onclick="location='dashboard.html'">Dashboard</button>`;
document.getElementById("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cur=k;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.k==k));render()};
add.onclick=()=>{location="publish.html"};
file.onchange=async()=>{const f=file.files[0];if(!f)return;const d=await db;d.transaction("v","readwrite").objectStore("v").add(f).onsuccess=()=>{cur="publish";location.reload()}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
load();
</script></body></html>
