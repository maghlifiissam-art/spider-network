<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rimaz</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d28d9">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#b08beb;color:#111;font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 24px 110px;background:#b08beb;border-bottom:1px solid #c4abf0}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.v{color:#fff}.card.v>*:not(video){position:relative;text-shadow:0 1px 8px #0008}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2e1065;font-weight:600}.v .tag{color:#fff}
h2{font-size:30px;line-height:1.15;margin:8px 0;font-weight:700;letter-spacing:-.02em}p{font-size:16px;line-height:1.5;color:#2b2340;max-width:560px}.v p{color:#fff}
.cta{display:inline-block;margin-top:10px;background:#111;color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600;width:max-content;font-size:14px}
nav{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:12px;background:#b08bebE6;backdrop-filter:blur(12px);border-bottom:1px solid #c4abf0;z-index:5;overflow-x:auto}
nav button{background:transparent;color:#2b2340;border:0;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500}nav button.on{background:#111;color:#fff}
#add{position:fixed;right:16px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:#d4a017;color:#2e1065;font-size:30px;z-index:5;box-shadow:0 6px 20px #0002}
.empty{display:grid;place-items:center;height:100dvh;color:#888}
</style></head><body>
<nav id="nav"></nav><a href="account.html" style="position:fixed;top:12px;right:12px;z-index:6;color:#111;font-size:13px;background:#c4abf0;padding:6px 12px;border-radius:14px;text-decoration:none" data-i="account">Account</a><a href="posts.html" style="position:fixed;top:12px;left:12px;z-index:6;color:#fff;font-size:13px;background:#c4abf0;color:#111;padding:6px 12px;border-radius:14px;text-decoration:none;font-weight:700" data-i="feed">Posts</a><a href="live.html" style="position:fixed;top:44px;left:12px;z-index:6;font-size:13px;background:#ff3b3b;color:#fff;padding:6px 10px;border-radius:14px;text-decoration:none;font-weight:700">&#9679; <span data-i="live">Live</span></a><a href="series.html" style="position:fixed;top:44px;right:12px;z-index:6;font-size:13px;background:#c4abf0;color:#111;padding:6px 12px;border-radius:14px;text-decoration:none" data-i="sf">Series</a><div style="position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #d4a017;border-radius:14px;padding:4px 14px;pointer-events:none"><img src="icon.svg" alt="" width="22" height="22"><b style="color:#d4a017;letter-spacing:3px;font-size:15px">RIMAZ</b></div><div id="feed"></div>
<button id="add" title="Post">+</button><input id="file" type="file" accept="video/*" hidden>
<script src="i18n.js"></script><script>
const SEC=["all","news","courses","ads","publish"].map(k=>[k,T(k)]);
let items=[],cur="all";
const db=new Promise(r=>{const q=indexedDB.open("reels",1);q.onupgradeneeded=()=>q.result.createObjectStore("v",{autoIncrement:true});q.onsuccess=()=>r(q.result)});
async function mine(){const d=await db;return new Promise(r=>{const o=d.transaction("v").objectStore("v").getAll();o.onsuccess=()=>r(o.result)})}
async function load(){const f=await (await fetch("feed.json")).json();const m=await mine();items=[...m.map(b=>({s:"publish",t:"My reel",b:"",blob:b})),...f];render()}
function render(){const el=document.getElementById("feed");el.innerHTML="";const l=items.filter(i=>cur=="all"||i.s==cur);
if(!l.length){el.innerHTML='<div class="empty">Nothing here yet</div>';return}
l.forEach(i=>{const c=document.createElement("section");c.className="card";if(i.blob)c.classList.add("v");
if(i.blob){const v=document.createElement("video");v.src=URL.createObjectURL(i.blob);v.loop=true;v.muted=true;v.playsInline=true;c.append(v)}
c.insertAdjacentHTML("beforeend",`<div class="tag">${i.s}</div><h2></h2><p></p>`);c.querySelector("h2").textContent=i.t;c.querySelector("p").textContent=i.b;
if(i.u)c.insertAdjacentHTML("beforeend",`<a class="cta" target="_blank" rel="noopener" href="${i.u}">Open</a>`);el.append(c)});
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(v)e.isIntersecting?v.play():v.pause()}),{threshold:.6});el.querySelectorAll(".card").forEach(c=>io.observe(c))}
document.getElementById("nav").innerHTML=SEC.map(([k,n])=>`<button data-k="${k}" class="${k==cur?"on":""}">${n}</button>`).join("")+`<button onclick="location='groups.html'">Groups</button><button onclick="location='dashboard.html'">Dashboard</button>`;
document.getElementById("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cur=k;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.k==k));render()};
add.onclick=()=>file.click();
file.onchange=async()=>{const f=file.files[0];if(!f)return;const d=await db;d.transaction("v","readwrite").objectStore("v").add(f).onsuccess=()=>{cur="publish";location.reload()}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
load();
</script></body></html>
