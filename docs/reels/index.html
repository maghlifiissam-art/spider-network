<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rimaz</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d28d9">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070714;color:#f1efff;font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 24px 110px;background:radial-gradient(ellipse at 25% 15%,#2b2f9a80,transparent 55%),radial-gradient(ellipse at 85% 85%,#6d28d966,transparent 55%),radial-gradient(circle at 70% 40%,#d4a0171f,transparent 30%),#070714}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.v>*:not(video){position:relative;text-shadow:0 1px 8px #000a}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d4a017;font-weight:600}
h2{font-size:32px;line-height:1.12;margin:8px 0;font-weight:700;letter-spacing:-.02em}p{font-size:16px;line-height:1.55;color:#c9c5e6;max-width:560px}
.cta{display:inline-block;margin-top:12px;background:#d4a017;color:#1a1033;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:700;width:max-content;font-size:14px;box-shadow:0 0 24px #d4a01755}
nav button{background:transparent;color:#aaa6d0;border:0;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500}nav button.on{background:#d4a017;color:#1a1033;font-weight:700}
#add{position:fixed;right:16px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:#d4a017;color:#1a1033;font-size:30px;z-index:5;box-shadow:0 0 28px #d4a01788}
.empty{display:grid;place-items:center;height:100dvh;color:#8d89b5}
#hd{position:fixed;top:0;left:0;right:0;z-index:5;background:#070714CC;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14;padding:8px 10px 6px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:6px;border:1.5px solid #d4a017;border-radius:12px;padding:3px 10px;flex:none}.brand b{color:#d4a017;letter-spacing:2px;font-size:14px}
.lk{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.lk a{flex:none;font-size:13px;background:#ffffff1c;color:#f1efff;padding:6px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}.lk a.lv{background:#ff3b3b;color:#fff;font-weight:700}
nav{position:static;display:flex;gap:4px;padding:0;background:none;border:0;backdrop-filter:none;overflow-x:auto;scrollbar-width:none;white-space:nowrap}nav button{flex:none}
.card{padding-top:120px}
</style></head><body>
<header id="hd"><div class="r1"><div class="brand"><img src="icon.svg" alt="" width="22" height="22"><b>RIMAZ</b></div><div class="lk"><a href="posts.html" data-i="feed">Posts</a><a href="live.html" class="lv">&#9679; <span data-i="live">Live</span></a><a href="series.html" data-i="sf">Series</a><a href="account.html" data-i="account">Account</a></div></div><nav id="nav"></nav></header><div id="feed"></div>
<button id="add" title="Post">+</button><input id="file" type="file" accept="video/*" hidden>
<script src="i18n.js"></script><script>
const SEC=["all","news","courses","ads","publish"].map(k=>[k,T(k)]);
let items=[],cur="all";
const db=new Promise(r=>{const q=indexedDB.open("reels",1);q.onupgradeneeded=()=>q.result.createObjectStore("v",{autoIncrement:true});q.onsuccess=()=>r(q.result)});
async function mine(){const d=await db;return new Promise(r=>{const o=d.transaction("v").objectStore("v").getAll();o.onsuccess=()=>r(o.result)})}
async function load(){const f=await (await fetch("feed.json")).json();const m=await mine();items=[...m.map(b=>({s:"publish",t:"My reel",b:"",blob:b})),...f];render()}
function render(){const el=document.getElementById("feed");el.innerHTML="";const l=items.filter(i=>cur=="all"||i.s==cur);
if(!l.length){el.innerHTML='<div class="empty">Nothing here yet</div>';return}
l.forEach(i=>{const c=document.createElement("section");c.className="card";if(i.blob)c.classList.add("v");
if(i.blob){const v=document.createElement("video");v.src=URL.createObjectURL(i.blob);v.loop=true;v.muted=true;v.playsInline=true;c.append(v)}
c.insertAdjacentHTML("beforeend",`<div class="tag">${i.s}</div><h2></h2><p></p>`);c.querySelector("h2").textContent=i.t;c.querySelector("p").textContent=i.b;
if(i.u)c.insertAdjacentHTML("beforeend",`<a class="cta" target="_blank" rel="noopener" href="${i.u}">Open</a>`);el.append(c)});
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(v)e.isIntersecting?v.play():v.pause()}),{threshold:.6});el.querySelectorAll(".card").forEach(c=>io.observe(c))}
document.getElementById("nav").innerHTML=SEC.map(([k,n])=>`<button data-k="${k}" class="${k==cur?"on":""}">${n}</button>`).join("")+`<button onclick="location='groups.html'">Groups</button><button onclick="location='dashboard.html'">Dashboard</button>`;
document.getElementById("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cur=k;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.k==k));render()};
add.onclick=()=>file.click();
file.onchange=async()=>{const f=file.files[0];if(!f)return;const d=await db;d.transaction("v","readwrite").objectStore("v").add(f).onsuccess=()=>{cur="publish";location.reload()}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
load();
</script></body></html>
