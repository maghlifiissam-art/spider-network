<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIMAZ</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#2b2f9a66,transparent 55%),radial-gradient(ellipse at 90% 100%,#6d28d94d,transparent 55%),#070714;background-attachment:fixed;color:#f1efff;font-family:system-ui,sans-serif;padding:28px 20px;max-width:440px;margin:auto;text-align:center}img.av{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid #d4a017;background:#ffffff14}h1{font-size:20px;margin:10px 0 2px}.h{color:#c4b5fd;font-size:14px;margin-bottom:4px}.st{opacity:.7;font-size:13px;margin-bottom:6px}.bio{font-size:14px;opacity:.9;margin:8px 0 18px;white-space:pre-wrap}a.lnk{display:block;background:#ffffff0f;border:1px solid #ffffff1c;border-radius:14px;padding:14px;margin:10px 0;color:#f1efff;text-decoration:none;font-weight:700;font-size:15px}a.lnk small{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:2px}a.store{background:#d4a017;color:#2e1065;border:0}.rl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.rl a{position:relative;display:block;border-radius:10px;overflow:hidden;background:#ffffff0d;aspect-ratio:9/14}.rl img{width:100%;height:100%;object-fit:cover}.rl span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#fff}.pw{margin-top:22px;font-size:12px;opacity:.55}.pw a{color:#c4b5fd}</style></head><body>
<div id="app"><p class="st" id="ld">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);
const T={en:{ld:"Loading…",gone:"This creator link does not exist.",reels:"Watch reels",reelss:"Short videos on RIMAZ",store:"Visit store",stores:"Products from this creator",follow:"Follow on RIMAZ",follows:"Open the channel and follow",latest:"Latest reels",pw:"Create your own free link on",flw:"followers",rl:"reels"},
ar:{ld:"جاري التحميل…",gone:"هذا الرابط غير موجود.",reels:"شاهد الريلز",reelss:"فيديوهات قصيرة على ريماز",store:"زيارة المتجر",stores:"منتجات هذا المبدع",follow:"تابع على ريماز",follows:"افتح القناة وتابع",latest:"أحدث الريلز",pw:"أنشئ رابطك المجاني على",flw:"متابع",rl:"ريلز"},
ary:{ld:"كيتحمل…",gone:"هاد الرابط ما كاينش.",reels:"شوف الريلز",reelss:"فيديوهات قصيرة على ريماز",store:"زور المتجر",stores:"منتجات هاد المبدع",follow:"تابع على ريماز",follows:"حل القناة وتابع",latest:"آخر الريلز",pw:"صاوب الرابط ديالك فابور على",flw:"متابع",rl:"ريلز"},
fr:{ld:"Chargement…",gone:"Ce lien créateur n'existe pas.",reels:"Voir les reels",reelss:"Vidéos courtes sur RIMAZ",store:"Visiter la boutique",stores:"Produits de ce créateur",follow:"Suivre sur RIMAZ",follows:"Ouvrir la chaîne et suivre",latest:"Derniers reels",pw:"Crée ton lien gratuit sur",flw:"abonnés",rl:"reels"}};
const lg=(new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang")||(navigator.language||"en").slice(0,2));
const t=T[lg]||T[/^(ar|ary)$/.test(lg)?"ar":"en"]||T.en;
document.documentElement.lang=lg;document.documentElement.dir=(lg==="ar"||lg==="ary")?"rtl":"ltr";
$("ld").textContent=t.ld;
const hnd=(new URLSearchParams(location.search).get("h")||"").replace(/^@/,"").trim();
(async()=>{
if(!hnd){$("app").innerHTML='<p class="st">'+t.gone+'</p>';return}
const{data:c}=await SB.from("channel_stats").select("*").eq("handle",hnd).maybeSingle();
if(!c){$("app").innerHTML='<p class="st">'+t.gone+'</p>';return}
document.title=c.name+" | RIMAZ";
const{data:ps}=await SB.from("posts").select("id,title,video_url,image_url").eq("channel_id",c.id).order("created_at",{ascending:false}).limit(6);
let h='<img class="av" src="'+(c.avatar_url||"icon-180.png")+'" alt=""><h1>'+c.name+'</h1><div class="h">@'+c.handle+'</div>';
h+='<div class="st">'+(c.followers||0)+' '+t.flw+' · '+(c.reels||0)+' '+t.rl+'</div>';
if(c.bio)h+='<div class="bio">'+String(c.bio).replace(/[<>&"]/g,"")+'</div>';
h+='<a class="lnk" href="channel.html?h='+encodeURIComponent(c.handle)+'">'+t.reels+'<small>'+t.reelss+'</small></a>';
h+='<a class="lnk store" href="store.html?h='+encodeURIComponent(c.handle)+'">'+t.store+'<small>'+t.stores+'</small></a>';
h+='<a class="lnk" href="channel.html?h='+encodeURIComponent(c.handle)+'">'+t.follow+'<small>'+t.follows+'</small></a>';
if(ps&&ps.length){h+='<div class="st" style="margin-top:16px">'+t.latest+'</div><div class="rl">';
for(const p of ps){const th=p.image_url||"";h+='<a href="channel.html?h='+encodeURIComponent(c.handle)+'">'+(th?'<img loading="lazy" src="'+th+'" alt="">':"")+'<span>▶</span></a>'}
h+='</div>'}
h+='<div class="pw">'+t.pw+' <a href="https://maghlifiissam-art.github.io/spider-network/reels/">RIMAZ</a></div>';
$("app").innerHTML=h;
})().catch(e=>{$("app").innerHTML='<p class="st">'+t.gone+'</p>'});
</script></body></html>
