<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body><p><a href="index.html">&rarr; Rimaz</a> &middot; <a href="dashboard.html">الداشبورد</a></p><h1>📊 إحصائيات RIMAZ</h1><div id="app">...</div>
<script src="common.js"></script><script>
(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const{data:d,error}=await SB.rpc("admin_stats");if(error||!d){location.replace("index.html");return}
const N=x=>Number(x||0).toLocaleString("en");
const bars=(rows,lab)=>{const W=700,H=160,p=22,mx=Math.max(1,...rows.map(r=>+r.v));const bw=(W-2*p)/Math.max(rows.length,1);let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';rows.forEach((r,i)=>{const h=(H-2*p)*(+r.v)/mx;s+='<rect x="'+(p+i*bw+2)+'" y="'+(H-p-h)+'" width="'+Math.max(bw-4,2)+'" height="'+Math.max(h,1)+'" rx="3" fill="#d4a017"><title>'+lab(r)+': '+N(r.v)+'</title></rect>'});return s+'<text x="'+p+'" y="14" fill="#c9c5e6" font-size="11">max '+N(mx)+'</text></svg>'};
const inact=Math.max(0,(+d.creators_total)-(+d.creators_active));
const dl=r=>String(r.d).slice(5),ml=r=>r.m;
app.innerHTML='<div class="g"><div class="k"><b>'+N(d.today)+'</b><span>مشاهدات اليوم</span></div><div class="k"><b>'+N(d.total_views)+'</b><span>كل المشاهدات</span></div><div class="k"><b>'+N(d.followers)+'</b><span>عدد المتابعين</span></div><div class="k"><b>'+N(d.members)+'</b><span>الأعضاء</span></div><div class="k"><b>'+N(d.creators_active)+'</b><span>صناع محتوى نشيطين (نشرو فآخر 30 يوم)</span></div><div class="k"><b>'+N(inact)+'</b><span>صناع محتوى غير نشيطين</span></div><div class="k"><b>'+N(d.ad_companies)+'</b><span>شركات/قنوات كتعلن فالمنصة</span></div><div class="k"><b>'+N(d.rev_today)+'</b><span>ربح اليوم</span></div><div class="k"><b>'+N(d.rev_month)+'</b><span>ربح هاد الشهر</span></div><div class="k"><b>'+N(d.rev_year)+'</b><span>ربح هاد العام</span></div></div><h2>المشاهدات اليومية (30 يوم)</h2>'+bars(d.daily||[],dl)+'<h2>المشاهدات الشهرية</h2>'+bars(d.monthly||[],ml)+'<h2>الربح اليومي (30 يوم)</h2>'+bars(d.rev_daily||[],dl)+'<h2>الربح الشهري</h2>'+bars(d.rev_monthly||[],ml)+'<h2>الربح السنوي</h2>'+bars(d.rev_yearly||[],ml)+'<p class="n">التسجيل اليومي بدا من '+esc(d.since||"")+' (قبل هاد التاريخ ما كاينش سجل يومي).</p>'})();
</script></body></html>
