<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1038;color:#fff;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#d4a017}h1{margin:.2em 0}input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff22;color:#fff}.card{background:#ffffff14;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#000}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="posts.html" data-i="feed"></a> &middot; <a href="series.html" data-i="sf"></a> &middot; <a href="account.html" data-i="account"></a></p><h1 data-i="pub"></h1><div id="app"></div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");const SEL='width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px';
(async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const u=session.user;const{data:ch}=await SB.from("channels").select("id,handle").eq("owner_id",u.id).maybeSingle();
if(!ch){app.innerHTML='<div class="card"><a class="btn" href="account.html">'+T("need_channel")+'</a></div>';return}
const{data:mySer}=await SB.from("series").select("id,title,kind").eq("owner_id",u.id).order("created_at",{ascending:false});
const qs=new URLSearchParams(location.search);
const topics=["general","news","courses","ads","publish","series","films"];
app.innerHTML='<div class="card"><select id="tp" style="'+SEL+'">'+topics.map(k=>'<option value="'+k+'"'+(qs.get("t")===k?" selected":"")+'>'+T(k)+'</option>').join("")+'</select>'+
'<div id="sx" style="display:none"><select id="sp" style="'+SEL+'"></select><div id="ns"><input id="nt" maxlength="120" placeholder="'+T("stitle")+'"><textarea id="nd" rows="2" maxlength="2000" placeholder="'+T("sdesc")+'"></textarea></div><div style="display:flex;gap:8px"><input id="se" type="number" min="1" max="99" value="1" placeholder="'+T("season")+'"><input id="ep" type="number" min="1" max="999" value="1" placeholder="'+T("episode")+'"></div><label class="muted"><input id="rt" type="checkbox" style="width:auto"> '+T("rights")+'</label></div>'+
'<input id="ti" maxlength="150" placeholder="'+T("ptitle")+'"><textarea id="bd" rows="5" maxlength="5000" placeholder="'+T("ptext")+'"></textarea><p class="muted">'+T("pfile")+'</p><input id="fl" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"><div id="pv"></div><button id="go">'+T("post_btn")+'</button><div id="msg" class="muted"></div></div>';
const $=id=>document.getElementById(id);
function sync(){const t=$("tp").value,sf=t==="series"||t==="films";$("sx").style.display=sf?"block":"none";if(!sf)return;const kind=t==="films"?"film":"series";
$("sp").innerHTML='<option value="">'+T("pickser")+'</option>'+(mySer||[]).filter(s=>s.kind===kind).map(s=>'<option value="'+s.id+'">'+esc(s.title)+'</option>').join("")+'<option value="new">+ '+T("newser")+'</option>';
$("se").style.display=$("ep").style.display=kind==="film"?"none":"block"}
function sync2(){$("ns").style.display=$("sp").value==="new"?"block":"none"}
$("tp").onchange=()=>{sync();sync2()};$("sp").onchange=sync2;sync();sync2();
$("fl").onchange=()=>{const f=$("fl").files[0];$("pv").innerHTML="";if(!f)return;const url=URL.createObjectURL(f);$("pv").innerHTML=f.type.startsWith("video")?'<video controls src="'+url+'"></video>':'<img src="'+url+'" style="width:100%;border-radius:12px;margin:8px 0">'};
$("go").onclick=async()=>{const msg=$("msg"),f=$("fl").files[0],body=$("bd").value.trim(),title=$("ti").value.trim(),topic=$("tp").value,sf=topic==="series"||topic==="films";
if(!f&&!body&&!title){msg.textContent=T("empty");return}
if(f&&f.size>52428800){msg.textContent=T("toobig");return}
let series_id=null,season=null,episode=null,rights=false;
if(sf){if(!f||!f.type.startsWith("video")){msg.textContent=T("needvideo");return}
if(!$("rt").checked){msg.textContent=T("needrights");return}
const kind=topic==="films"?"film":"series";let sid=$("sp").value;if(!sid){msg.textContent=T("needser");return}
if(sid==="new"){const nt=$("nt").value.trim();if(!nt){msg.textContent=T("stitle");return}
const r=await SB.from("series").insert({owner_id:u.id,channel_id:ch.id,kind,title:nt,description:$("nd").value.trim()||null}).select("id").single();if(r.error){msg.textContent=r.error.message;return}sid=r.data.id}
series_id=sid;rights=true;if(kind==="series"){season=+$("se").value||1;episode=+$("ep").value||1}}
msg.textContent=T("posting");let media_url=null,kind2="text";
if(f){kind2=f.type.startsWith("video")?"video":"image";const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");const path=u.id+"/"+Date.now()+"."+ext;
const up=await SB.storage.from("media").upload(path,f,{contentType:f.type,cacheControl:"31536000"});if(up.error){msg.textContent=up.error.message;return}
media_url=SB.storage.from("media").getPublicUrl(path).data.publicUrl}
const r=await SB.from("posts").insert({owner_id:u.id,channel_id:ch.id,kind:kind2,topic,title:title||null,body:body||null,media_url,series_id,season,episode,rights_confirmed:rights});
if(r.error){msg.textContent=r.error.message;return}
msg.textContent=T("posted");setTimeout(()=>location.href=sf?"series.html?id="+series_id:"channel.html?h="+encodeURIComponent(ch.handle),700)}})();
</script></body></html>
