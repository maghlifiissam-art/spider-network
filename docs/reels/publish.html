let src=null;if(window.__sh){const raw=$("su").value.trim();let uo;try{uo=new URL(raw)}catch(e){msg.textContent="URL?";return}if(uo.protocol!=="https:"){msg.textContent="https only";return}const h=uo.hostname.replace(/^www\.|^m\./,"");const PL=[["youtube",/(^|\.)(youtube\.com|youtu\.be)$/],["tiktok",/(^|\.)tiktok\.com$/],["instagram",/(^|\.)instagram\.com$/],["facebook",/(^|\.)(facebook\.com|fb\.watch)$/],["x",/(^|\.)(x\.com|twitter\.com)$/]];const pl=(PL.find(a=>a[1].test(h))||["other"])[0];src={source_url:uo.href,source_platform:pl,source_author:$("sa").value.trim()||null}}

msg.textContent=T("posting");let media_url=null,kind2="text";
let poster_url=null;
if(f){kind2=f.type.startsWith("video")?"video":"image";let uf=f,ct=f.type,ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
