<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body><p><a href="index.html">&larr; Rimaz</a> &middot; <a href="messages.html" id="inb"></a></p><h1 id="h1"></h1><div id="app">...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const LG=(localStorage.getItem("lang")||"en");
const S={en:{t:"Messages",inbox:"Inbox",none:"No conversations yet. Open a channel and send a message.",ph:"Write a message...",send:"Send",login:"Sign in to use messages",nouser:"Channel not found",self:"You cannot message yourself",new:"new"},
fr:{t:"Messages",inbox:"Boîte de réception",none:"Aucune conversation. Ouvrez une chaîne et écrivez.",ph:"Écrire un message...",send:"Envoyer",login:"Connectez-vous pour les messages",nouser:"Chaîne introuvable",self:"Vous ne pouvez pas vous écrire",new:"nouveau"},
ar:{t:"الرسائل",inbox:"صندوق الوارد",none:"لا توجد محادثات بعد. افتح قناة وأرسل رسالة.",ph:"اكتب رسالة...",send:"إرسال",login:"سجّل الدخول لاستخدام الرسائل",nouser:"القناة غير موجودة",self:"لا يمكنك مراسلة نفسك",new:"جديد"},
ary:{t:"الرسائل",inbox:"صندوق الوارد",none:"مازال ما كاين حتى محادثة. حل شي قناة وصيفط رسالة.",ph:"كتب رسالة...",send:"صيفط",login:"دخل باش تستعمل الرسائل",nouser:"القناة ما لقيناهاش",self:"ما يمكنش تراسل راسك",new:"جديد"}};Object.assign(S,(EXD["messages"]||{}).S);;
const X=k=>(S[LG]||S.en)[k]||S.en[k];
document.getElementById("h1").textContent="\u2709 "+X("t");document.getElementById("inb").textContent=X("inbox");
const h=new URLSearchParams(location.search).get("h");
(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();
if(!session){app.innerHTML='<a class="btn" href="account.html">'+X("login")+'</a>';return}const me=session.user.id;
const chan=async ids=>{const m={};if(!ids.length)return m;const{data}=await SB.from("channels").select("owner_id,handle,name").in("owner_id",ids);(data||[]).forEach(c=>m[c.owner_id]=c);return m};
if(!h){const{data}=await SB.from("dms").select("*").order("created_at",{ascending:false}).limit(200);const conv={};(data||[]).forEach(d=>{const o=d.sender_id===me?d.recipient_id:d.sender_id;if(!conv[o])conv[o]={last:d,unread:0};if(d.recipient_id===me&&!d.read)conv[o].unread++});
const ids=Object.keys(conv);const cm=await chan(ids);
app.innerHTML=ids.map(o=>{const c=cm[o],v=conv[o];return c?'<a class="card" style="display:block;color:inherit;text-decoration:none" href="messages.html?h='+encodeURIComponent(c.handle)+'"><b>'+esc(c.name)+'</b> <span class="muted">@'+esc(c.handle)+'</span>'+(v.unread?' <span style="background:#d4a017;color:#1a1033;border-radius:9px;padding:1px 8px;font-size:12px">'+v.unread+' '+X("new")+'</span>':'')+'<p class="muted" style="margin:6px 0 0">'+esc(v.last.body.slice(0,80))+'</p></a>':''}).join("")||'<p class="muted">'+X("none")+'</p>';return}
const{data:c}=await SB.from("channels").select("owner_id,handle,name").eq("handle",h).maybeSingle();if(!c){app.innerHTML='<p class="muted">'+X("nouser")+'</p>';return}
if(c.owner_id===me){app.innerHTML='<p class="muted">'+X("self")+'</p>';return}
app.innerHTML='<h3>'+esc(c.name)+' <span class="muted">@'+esc(c.handle)+'</span></h3><div id="th"></div><div style="position:sticky;bottom:0;background:#070714;padding:8px 0"><textarea id="bd" rows="2" maxlength="1000" placeholder="'+X("ph")+'"></textarea><button class="btn" id="sd">'+X("send")+'</button></div>';
const load=async()=>{const{data}=await SB.from("dms").select("*").or("and(sender_id.eq."+me+",recipient_id.eq."+c.owner_id+"),and(sender_id.eq."+c.owner_id+",recipient_id.eq."+me+")").order("created_at",{ascending:true}).limit(200);
document.getElementById("th").innerHTML=(data||[]).map(d=>'<div style="display:flex;justify-content:'+(d.sender_id===me?"flex-end":"flex-start")+'"><div style="max-width:80%;margin:4px 0;padding:8px 12px;border-radius:14px;white-space:pre-wrap;background:'+(d.sender_id===me?"#d4a017;color:#1a1033":"#ffffff1c")+'">'+esc(d.body)+'</div></div>').join("");SB.rpc("dm_mark_read",{other:c.owner_id})};
await load();setInterval(load,8000);
sd.onclick=async()=>{const b=bd.value.trim();if(!b)return;sd.disabled=true;const r=await SB.from("dms").insert({recipient_id:c.owner_id,body:b});sd.disabled=false;if(r.error){alert(r.error.message);return}bd.value="";load()}})();
</script></body></html>
