(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();
const faq='<h3>'+X("faq")+'</h3>'+[1,2,3,4,5].map(i=>'<details class="card"><summary><b>'+X("q"+i)+'</b></summary><p>'+X("a"+i)+'</p></details>').join("");

async function draw(){const{data:ts}=await SB.from("support_tickets").select("*").order("created_at",{ascending:false}).limit(60);

const row=(t,adm)=>'<div class="card"><div class="muted">'+esc(X("c_"+t.category))+' &middot; <span style="color:'+st(t)+'">'+X(t.status)+'</span></div><b>'+esc(t.subject)+'</b><p style="white-space:pre-wrap">'+esc(t.message)+'</p>'+(t.admin_reply?'<div style="border-inline-start:3px solid #22c55e;padding:4px 10px;margin:6px 0"><b>'+X("reply")+':</b><p style="white-space:pre-wrap;margin:4px 0">'+esc(t.admin_reply)+'</p></div>':"")+(adm&&t.status!=="closed"?'<textarea data-r="'+t.id+'" rows="2" maxlength="2000" placeholder="'+X("rph")+'"></textarea><button data-a="rep" data-i="'+t.id+'">'+X("rsend")+'</button>':"")+(!adm&&t.status!=="closed"?'<button data-a="cl" data-i="'+t.id+'" style="background:#ffffff1c;color:#f1efff">'+X("close")+'</button>':"")+'</div>';
