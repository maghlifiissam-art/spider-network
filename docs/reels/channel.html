ight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff1c;color:#f1efff}.card{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#070714}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="account.html" data-i="account"></a></p><div id="app">Loading...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");const hnd=new URLSearchParams(location.search).get("h");
(async()=>{if(!hnd){app.textContent=T("nochan");return}
const{data:c}=await SB.from("channel_stats").select("*").eq("handle",hnd).maybeSingle();
if(!c){app.textContent=T('nochan');return}
const{data:{session}}=await SB.auth.getSession();let following=false;const{data:lv}=await SB.from("lives").select("id").eq("channel_id",c.id).eq("status","live").limit(1);
if(session){const r=await SB.from("follows").select("*",{count:"exact",head:true}).eq("channel_id",c.id).eq("follower_id",session.user.id);following=(r.count||0)>0}
let n=c.followers||0;
app.innerHTML='<h1>'+esc(c.name)+'</h1><div class="muted">@'+esc(c.handle)+' &middot; <span id="fc">'+n+'</span>'+' '+T('followers')+' &middot; '+(c.reels||0)+''+' '+T('nreels')+'</div><p>'+esc(c.bio)+'</p><button id="fb"></button>'+(lv&&lv.length?'<a class="btn" style="background:#ff3b3b;color:#fff" href="live.html">&#9679; LIVE</a>':'')+'<div id="vs"></div>';
{const{data:fbg}=await SB.from("founder_badges").select("founder_no").eq("user_id",c.owner_id).maybeSingle();if(fbg){const FL={en:"Founding Member",fr:"Membre fondateur",ar:"عضو مؤسس",ary:"عضو مؤسس",es:"Miembro fundador",pt:"Membro fundador",de:"Gründungsmitglied",tr:"Kurucu üye"};const bd=document.createElement("div");bd.style.cssText="display:inline-block;margin:6px 0;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,#d4a017,#f5d36b);color:#1a1033;font-weight:800;font-size:13px";bd.textContent="\u{1F3C5} "+(FL[localStorage.getItem("lang")||"en"]||FL.en)+" #"+fbg.founder_no;document.getElementById("fc").closest("div").after(bd)}}
const fb=document.getElementById("fb");if(session&&session.user.id===c.owner_id)fb.style.display="none";const paint=()=>fb.textContent=following?T('following'):T('follow');paint();
if(session&&session.user.id!==c.owner_id){const af=document.createElement("button");af.style.marginInlineStart="8px";af.style.background="#ffffff1c";af.style.color="#f1efff";const AL={en:"+ Friend",fr:"+ Ami",ar:"+ صديق",ary:"+ صاحب"};af.textContent=AL[localStorage.getItem("lang")||"en"]||AL.en;af.onclick=async()=>{const r=await SB.from("friendships").insert({requester_id:session.user.id,addressee_id:c.owner_id});af.textContent=r.error?(r.error.code==="23505"?"✓":"!"):"✓";af.disabled=true};fb.after(af)}
fb.onclick=async()=>{if(!session){location.href="account.html";return}
if(following){await SB.from("follows").delete().eq("channel_id",c.id).eq("follower_id",session.user.id);n--}
else{const r=await SB.from("follows").insert({channel_id:c.id,follower_id:session.user.id});if(r.error)return;n++}
following=!following;paint();document.getElementById("fc").textContent=n};
const{data:ps}=await SB.from("posts").select("*").eq("channel_id",c.id).order("created_at",{ascending:false});
const pr=(ps||[]).map(p=>'<div class="card"><span class="muted">'+T(p.topic)+'</span>'+(p.title?'<h3>'+esc(p.title)+'</h3>':'')+(p.body?'<p style="white-space:pre-wrap">'+esc(p.body)+'</p>':'')+(p.source_url?'<div class="muted" style="border-inline-start:4px solid #d4a017;padding:6px 10px;margin:6px 0">\u{1F517} '+esc(p.source_platform||'web')+(p.source_author?' · '+esc(p.source_author):'')+' <a href="'+esc(p.source_url)+'" target="_blank" rel="noopener noreferrer nofollow">\u2197</a></div>':'')+(p.kind==="video"?'<video controls playsinline preload="none"'+(p.poster_url?' poster="'+esc(p.poster_url)+'"':"")+' src="'+esc(p.media_url)+'"></video>':'')+(p.kind==="image"?'<img loading="lazy" src="'+esc(p.media_url)+'" style="width:100%;border-radius:12px">':'')+(session&&p.owner_id===session.user.id?'<button class="btn alt delp" data-id="'+p.id+'" style="margin-top:8px;background:#ffffff1c;color:#f1efff">&#128465; '+T("del")+'</button>':'')+'</div>').join("");
const{data:vs}=await SB.from("videos").select("*").eq("channel_id",c.id).order("created_at",{ascending:false});
document.getElementById("vs").innerHTML=pr+(vs||[]).map(v=>'<div class="card"><b>'+esc(v.caption||"")+'</b>'+(v.video_url?'<video controls playsinline src="'+esc(v.video_url)+'"></video>':"")+'</div>').join("")||'<p class="muted">'+T('nopost')+'</p>';
})();
document.addEventListener("click",async e=>{const b=e.target.closest(".delp");if(!b)return;if(!confirm(T("del")+"?"))return;const r=await SB.from("posts").delete().eq("id",b.dataset.id);if(r.error){alert(r.error.message);return}b.closest(".card").remove()});
</script><script>(async()=>{try{const h=new URLSearchParams(location.search).get("h");if(!h)return;const a=await SB.from("channel_stats").select("id").eq("handle",h).limit(1);if(!a.data||!a.data[0])return;const b=await SB.from("channel_stars").select("stars,views").eq("channel_id",a.data[0].id).limit(1);const s=(b.data&&b.data[0])?b.data[0].stars:0;if(!s)return;for(let k=0;k<40&&!document.getElementById("fc");k++)await new Promise(r=>setTimeout(r,150));const f=document.getElementById("fc");if(!f)return;const d=document.createElement("div");d.title=(b.data[0].views||0)+" views";d.style.cssText="color:#d4a017;font-size:22px;letter-spacing:2px;margin:4px 0";d.textContent="\u2605".repeat(s)+"\u2606".repeat(5-s);f.parentElement.after(d)}catch(e){}})()</script></body></html>
