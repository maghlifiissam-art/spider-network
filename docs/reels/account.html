<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="groups.html" data-i="groups"></a></p><h1 data-i="account"></h1><div id="app"></div>
<p class="muted"><a href="privacy.html" data-i="privacy"></a> &middot; <a href="terms.html" data-i="terms"></a></p>
<script type="text/rimaz-locale" src="i18n.js"></script><script type="text/rimaz-locale" src="common.js"></script><script type="text/rimaz-locale">
const app=document.getElementById("app");
const FWD={en:["Forgot password?","Type your email above first.","If this email has an account, a reset link is on its way. Check your inbox.","Choose a new password","New password (min 6)","Save password","Password updated. You are signed in."],fr:["Mot de passe oublié ?","Saisissez d'abord votre email ci-dessus.","Si cet email a un compte, un lien de réinitialisation est envoyé. Vérifiez votre boîte.","Choisissez un nouveau mot de passe","Nouveau mot de passe (min 6)","Enregistrer","Mot de passe mis à jour. Vous êtes connecté."],ar:["نسيت كلمة المرور؟","اكتب بريدك الإلكتروني أعلاه أولاً.","إذا كان لهذا البريد حساب، فرابط إعادة التعيين في الطريق. تحقق من بريدك.","اختر كلمة مرور جديدة","كلمة المرور الجديدة (6 أحرف على الأقل)","حفظ","تم تحديث كلمة المرور. أنت مسجل الدخول."],ary:["نسيتي الباسوورد؟","كتب الإيميل ديالك فوق الأول.","إلا كان هاد الإيميل عندو حساب، الرابط جاي فالطريق. شوف الإيميل ديالك.","اختار باسوورد جديد","الباسوورد الجديد (6 حروف على الأقل)","حفظ","تبدل الباسوورد. راك دخلتي."]};const FW=()=>FWD[localStorage.getItem("lang")]||FWD.en;
let recovering=/type=recovery/.test(location.hash);
function recoverUI(){recovering=true;app.innerHTML='<div class="card"><b>'+FW()[3]+'</b><input id="np" type="password" autocomplete="new-password" placeholder="'+FW()[4]+'"><button id="sp">'+FW()[5]+'</button><div id="rm" class="muted"></div></div>';sp.onclick=async()=>{if(np.value.length<6){rm.textContent=FW()[4];return}const r=await SB.auth.updateUser({password:np.value});if(r.error){rm.textContent=r.error.message;return}rm.textContent=FW()[6];recovering=false;setTimeout(()=>{history.replaceState(null,"",location.pathname);show()},1200)}}
async function show(){if(recovering){recoverUI();return}const{data:{session}}=await SB.auth.getSession();if(!session)return login();{const rt=sessionStorage.getItem("rimaz_ret");if(rt&&/^[\w.-]+\.html(#post=[\w-]+)?$/.test(rt)){sessionStorage.removeItem("rimaz_ret");location.replace(rt);return}}
const u=session.user;let nref=null;try{const rc=localStorage.getItem("rimaz_ref");if(rc){const q=await SB.rpc("claim_referral",{c:rc});localStorage.removeItem("rimaz_ref");if(!q.error)nref=q.data}}catch(e){}const{data:p}=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();
const{data:ch}=await SB.from("channels").select("*").eq("owner_id",u.id).maybeSingle();
let h='<div class="card"><b>'+esc(u.user_metadata?.full_name||u.email)+'</b><div class="muted">'+esc(u.email)+' &middot; '+T('role')+': '+esc(p?.role||"user")+'</div>';
if(p?.referral_code){try{localStorage.setItem("rimaz_mycode",p.referral_code)}catch(e){}const lg=localStorage.getItem("lang")||"en";const W={en:["Your invite link","Copy / share","People who joined with your link","Copied"],fr:["Votre lien d'invitation","Copier / partager","Personnes inscrites avec votre lien","Copié"],ar:["رابط الدعوة الخاص بك","نسخ / مشاركة","عدد من انضموا برابطك","تم النسخ"],ary:["رابط الدعوة ديالك","نسخ / مشاركة","شحال تسجلو بالرابط ديالك","تنسخ"]};const w=W[lg]||W.en;const link=BASE+"index.html?ref="+encodeURIComponent(p.referral_code);if(nref==null){const q=await SB.rpc("claim_referral",{c:""});nref=q.error?0:q.data}h+='<div class="muted" style="margin-top:8px">'+w[0]+':</div><input readonly value="'+esc(link)+'" onclick="this.select()"><button id="shr">'+w[1]+'</button><div class="muted">'+w[2]+': <b>'+(nref||0)+'</b></div>';window._shr=[link,w[3]]}
h+='</div>';
if(p?.role==="admin")h+='<a class="btn" href="dashboard.html">'+T('admin')+'</a>';
if(ch)h+='<a class="btn" href="publish.html">'+T('pub')+'</a>';if(ch)h+='<div class="card">'+T('yours')+' <a href="channel.html?h='+encodeURIComponent(ch.handle)+'">@'+esc(ch.handle)+'</a></div>';
else h+='<div class="card"><b>'+T('mk_title')+'</b><input id="hd" placeholder="'+T('handle')+'"><input id="nm" placeholder="'+T('cname')+'"><textarea id="bio" placeholder="'+T('bio')+'" rows="2"></textarea><button id="mk">'+T('mk')+'</button><div id="msg" class="muted"></div></div>';
h+='<button class="alt" id="out">'+T('signout')+'</button>';app.innerHTML=h;
const sb=document.getElementById("shr");if(sb)sb.onclick=async()=>{const[l,ok]=window._shr;if(navigator.share){try{await navigator.share({title:"RIMAZ",url:l})}catch(e){}}else{try{await navigator.clipboard.writeText(l);sb.textContent=ok}catch(e){prompt("",l)}}};document.getElementById("out").onclick=async()=>{await SB.auth.signOut();show()};try{const{data:{session:ss}}=await SB.auth.getSession();if(ss&&!document.getElementById("ebd")){const{data:pe}=await SB.from("profiles").select("early_no,founder_no").eq("id",ss.user.id).maybeSingle();const lg2=localStorage.getItem("lang")||"en";if(pe&&(pe.early_no||pe.founder_no)){const el=document.createElement("div");el.id="ebd";el.style.cssText="display:inline-block;margin:8px 0;padding:5px 14px;border-radius:999px;background:#ffffff14;border:1px solid #d4a017;color:#d4a017;font-weight:800;font-size:13px";el.textContent=pe.founder_no?"\u{1F3C5} "+(lg2==="ar"||lg2==="ary"?"عضو مؤسس":"Founding Member")+" #"+pe.founder_no:"\u{1F31F} "+(lg2==="ar"||lg2==="ary"?"مبدع مبكر":lg2==="fr"?"Créateur précoce":"Early Creator")+" #"+pe.early_no;const nm=document.getElementById("nm");(nm||document.getElementById("app")).after(el)}}}catch(e){}
const mk=document.getElementById("mk");if(mk)mk.onclick=async()=>{const handle=hd.value.trim().toLowerCase();
if(!/^[a-z0-9_]{3,30}$/.test(handle)){msg.textContent=T('badhandle');return}
const r=await SB.from("channels").insert({owner_id:u.id,handle,name:nm.value.trim()||handle,bio:bio.value.trim()});
if(r.error){msg.textContent=r.error.message;return}show()}}
function login(){app.innerHTML='<div class="card"><button id="g">'+T('google')+'</button></div><div class="card"><input id="em" type="email" placeholder="'+T('email')+'"><input id="pw" type="password" placeholder="'+T('pw')+'"><button id="in">'+T('signin')+'</button><button class="alt" id="up">'+T('signup')+'</button><div style="margin:4px 0"><a href="#" id="fp">'+FW()[0]+'</a></div><div id="ts" style="margin:8px 0"></div><div id="msg" class="muted"></div></div>';
let ctok="",twid=null;const CAP={en:"Please wait for the security check.",fr:"Attendez la vérification de sécurité.",ar:"انتظر اكتمال التحقق الأمني.",ary:"تسنى حتى يكمل التحقق الأمني."};const capm=()=>CAP[localStorage.getItem("lang")]||CAP.en;
const tsr=()=>{if(window.turnstile&&!twid)twid=turnstile.render("#ts",{sitekey:"0x4AAAAAAFQzPQBVS74Ccc7O",callback:t=>{ctok=t},"expired-callback":()=>{ctok=""},"error-callback":()=>{ctok=""}});else if(!window.turnstile)setTimeout(tsr,300)};tsr();
const cdone=()=>{ctok="";if(window.turnstile&&twid!==null)turnstile.reset(twid)};
g.onclick=()=>SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:BASE+"account.html"}});
in_=document.getElementById("in");in_.onclick=async()=>{if(!ctok){msg.textContent=capm();return}const r=await SB.auth.signInWithPassword({email:em.value,password:pw.value,options:{captchaToken:ctok}});cdone();r.error?msg.textContent=r.error.message:show()};
fp.onclick=async(ev)=>{ev.preventDefault();if(!em.value.trim()){msg.textContent=FW()[1];return}if(!ctok){msg.textContent=capm();return}const r=await SB.auth.resetPasswordForEmail(em.value.trim(),{redirectTo:BASE+"account.html",captchaToken:ctok});cdone();msg.textContent=r.error?r.error.message:FW()[2]};
up.onclick=async()=>{if(!ctok){msg.textContent=capm();return}const r=await SB.auth.signUp({email:em.value,password:pw.value,options:{emailRedirectTo:BASE+"account.html",captchaToken:ctok}});cdone();msg.textContent=r.error?r.error.message:(r.data.session?"":T('confirm'));if(r.data?.session)show()}}
SB.auth.onAuthStateChange((e)=>{if(e==="PASSWORD_RECOVERY"){recoverUI();setTimeout(()=>{if(recovering&&!document.getElementById("np"))recoverUI()},500)}else if(e==="SIGNED_IN")show()});show();
</script></body></html>
