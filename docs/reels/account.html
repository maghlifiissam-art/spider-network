<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account - Rimaz</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#2b2f9a66,transparent 55%),radial-gradient(ellipse at 90% 100%,#6d28d94d,transparent 55%),#070714;background-attachment:fixed;color:#f1efff;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#c4b5fd}h1{margin:.2em 0}input,textarea{background:#ffffff12;color:#f1efff;width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff1c;color:#f1efff}.card{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#070714}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="groups.html" data-i="groups"></a></p><h1 data-i="account"></h1><div id="app"></div>
<p class="muted"><a href="privacy.html" data-i="privacy"></a> &middot; <a href="terms.html" data-i="terms"></a></p>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");
async function show(){const{data:{session}}=await SB.auth.getSession();if(!session)return login();{const rt=sessionStorage.getItem("rimaz_ret");if(rt&&/^[\w.-]+\.html(#post=[\w-]+)?$/.test(rt)){sessionStorage.removeItem("rimaz_ret");location.replace(rt);return}}
const u=session.user;let nref=null;try{const rc=localStorage.getItem("rimaz_ref");if(rc){const q=await SB.rpc("claim_referral",{c:rc});localStorage.removeItem("rimaz_ref");if(!q.error)nref=q.data}}catch(e){}const{data:p}=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();
const{data:ch}=await SB.from("channels").select("*").eq("owner_id",u.id).maybeSingle();
let h='<div class="card"><b>'+esc(u.user_metadata?.full_name||u.email)+'</b><div class="muted">'+esc(u.email)+' &middot; '+T('role')+': '+esc(p?.role||"user")+'</div>';
if(p?.referral_code){try{localStorage.setItem("rimaz_mycode",p.referral_code)}catch(e){}const lg=localStorage.getItem("lang")||"en";const W={en:["Your invite link","Copy / share","People who joined with your link","Copied"],fr:["Votre lien d'invitation","Copier / partager","Personnes inscrites avec votre lien","Copié"],ar:["رابط الدعوة الخاص بك","نسخ / مشاركة","عدد من انضموا برابطك","تم النسخ"],ary:["رابط الدعوة ديالك","نسخ / مشاركة","شحال تسجلو بالرابط ديالك","تنسخ"]};const w=W[lg]||W.en;const link=BASE+"index.html?ref="+encodeURIComponent(p.referral_code);if(nref==null){const q=await SB.rpc("claim_referral",{c:""});nref=q.error?0:q.data}h+='<div class="muted" style="margin-top:8px">'+w[0]+':</div><input readonly value="'+esc(link)+'" onclick="this.select()"><button id="shr">'+w[1]+'</button><div class="muted">'+w[2]+': <b>'+(nref||0)+'</b></div>';window._shr=[link,w[3]]}
h+='</div>';
if(p?.role==="admin")h+='<a class="btn" href="dashboard.html">'+T('admin')+'</a>';
if(ch)h+='<a class="btn" href="publish.html">'+T('pub')+'</a>';if(ch)h+='<div class="card">'+T('yours')+' <a href="channel.html?h='+encodeURIComponent(ch.handle)+'">@'+esc(ch.handle)+'</a></div>';
else h+='<div class="card"><b>'+T('mk_title')+'</b><input id="hd" placeholder="'+T('handle')+'"><input id="nm" placeholder="'+T('cname')+'"><textarea id="bio" placeholder="'+T('bio')+'" rows="2"></textarea><button id="mk">'+T('mk')+'</button><div id="msg" class="muted"></div></div>';
h+='<button class="alt" id="out">'+T('signout')+'</button>';app.innerHTML=h;
const sb=document.getElementById("shr");if(sb)sb.onclick=async()=>{const[l,ok]=window._shr;if(navigator.share){try{await navigator.share({title:"RIMAZ",url:l})}catch(e){}}else{try{await navigator.clipboard.writeText(l);sb.textContent=ok}catch(e){prompt("",l)}}};document.getElementById("out").onclick=async()=>{await SB.auth.signOut();show()};try{const{data:{session:ss}}=await SB.auth.getSession();if(ss&&!document.getElementById("ebd")){const{data:pe}=await SB.from("profiles").select("early_no,founder_no").eq("id",ss.user.id).maybeSingle();const lg2=localStorage.getItem("lang")||"en";if(pe&&(pe.early_no||pe.founder_no)){const el=document.createElement("div");el.id="ebd";el.style.cssText="display:inline-block;margin:8px 0;padding:5px 14px;border-radius:999px;background:#ffffff14;border:1px solid #d4a017;color:#d4a017;font-weight:800;font-size:13px";el.textContent=pe.founder_no?"\u{1F3C5} "+(lg2==="ar"||lg2==="ary"?"عضو مؤسس":"Founding Member")+" #"+pe.founder_no:"\u{1F31F} "+(lg2==="ar"||lg2==="ary"?"مبدع مبكر":lg2==="fr"?"Créateur précoce":"Early Creator")+" #"+pe.early_no;const nm=document.getElementById("nm");(nm||document.getElementById("app")).after(el)}}}catch(e){}
const mk=document.getElementById("mk");if(mk)mk.onclick=async()=>{const handle=hd.value.trim().toLowerCase();
if(!/^[a-z0-9_]{3,30}$/.test(handle)){msg.textContent=T('badhandle');return}
const r=await SB.from("channels").insert({owner_id:u.id,handle,name:nm.value.trim()||handle,bio:bio.value.trim()});
if(r.error){msg.textContent=r.error.message;return}show()}}
function login(){app.innerHTML='<div class="card"><button id="g">'+T('google')+'</button></div><div class="card"><input id="em" type="email" placeholder="'+T('email')+'"><input id="pw" type="password" placeholder="'+T('pw')+'"><button id="in">'+T('signin')+'</button><button class="alt" id="up">'+T('signup')+'</button><div id="msg" class="muted"></div></div>';
g.onclick=()=>SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:BASE+"account.html"}});
in_=document.getElementById("in");in_.onclick=async()=>{const r=await SB.auth.signInWithPassword({email:em.value,password:pw.value});r.error?msg.textContent=r.error.message:show()};
up.onclick=async()=>{const r=await SB.auth.signUp({email:em.value,password:pw.value,options:{emailRedirectTo:BASE+"account.html"}});msg.textContent=r.error?r.error.message:(r.data.session?"":T('confirm'));if(r.data?.session)show()}}
SB.auth.onAuthStateChange((e)=>{if(e==="SIGNED_IN")show()});show();
</script></body></html>
