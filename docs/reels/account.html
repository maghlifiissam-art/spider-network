<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#111;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#d4a017}h1{margin:.2em 0}input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ececf0;color:#111}.card{background:#f4f4f6;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#fff}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body>
<p><a href="index.html">&larr; Rimaz</a> &middot; <a href="groups.html" data-i="groups"></a></p><h1 data-i="account"></h1><div id="app"></div>
<p class="muted"><a href="privacy.html" data-i="privacy"></a> &middot; <a href="terms.html" data-i="terms"></a></p>
<script src="i18n.js"></script><script src="common.js"></script><script>
const app=document.getElementById("app");
async function show(){const{data:{session}}=await SB.auth.getSession();if(!session)return login();
const u=session.user;const{data:p}=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();
const{data:ch}=await SB.from("channels").select("*").eq("owner_id",u.id).maybeSingle();
let h='<div class="card"><b>'+esc(u.user_metadata?.full_name||u.email)+'</b><div class="muted">'+esc(u.email)+' &middot; '+T('role')+': '+esc(p?.role||"user")+'</div>';
if(p?.referral_code)h+='<div class="muted">'+T('invite')+': <b>'+esc(p.referral_code)+'</b></div>';
h+='</div>';
if(p?.role==="admin")h+='<a class="btn" href="dashboard.html">'+T('admin')+'</a>';
if(ch)h+='<a class="btn" href="publish.html">'+T('pub')+'</a>';if(ch)h+='<div class="card">'+T('yours')+' <a href="channel.html?h='+encodeURIComponent(ch.handle)+'">@'+esc(ch.handle)+'</a></div>';
else h+='<div class="card"><b>'+T('mk_title')+'</b><input id="hd" placeholder="'+T('handle')+'"><input id="nm" placeholder="'+T('cname')+'"><textarea id="bio" placeholder="'+T('bio')+'" rows="2"></textarea><button id="mk">'+T('mk')+'</button><div id="msg" class="muted"></div></div>';
h+='<button class="alt" id="out">'+T('signout')+'</button>';app.innerHTML=h;
document.getElementById("out").onclick=async()=>{await SB.auth.signOut();show()};
const mk=document.getElementById("mk");if(mk)mk.onclick=async()=>{const handle=hd.value.trim().toLowerCase();
if(!/^[a-z0-9_]{3,30}$/.test(handle)){msg.textContent=T('badhandle');return}
const r=await SB.from("channels").insert({owner_id:u.id,handle,name:nm.value.trim()||handle,bio:bio.value.trim()});
if(r.error){msg.textContent=r.error.message;return}show()}}
function login(){app.innerHTML='<div class="card"><button id="g">'+T('google')+'</button></div><div class="card"><input id="em" type="email" placeholder="'+T('email')+'"><input id="pw" type="password" placeholder="'+T('pw')+'"><button id="in">'+T('signin')+'</button><button class="alt" id="up">'+T('signup')+'</button><div id="msg" class="muted"></div></div>';
g.onclick=()=>SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:BASE+"account.html"}});
in_=document.getElementById("in");in_.onclick=async()=>{const r=await SB.auth.signInWithPassword({email:em.value,password:pw.value});r.error?msg.textContent=r.error.message:show()};
up.onclick=async()=>{const r=await SB.auth.signUp({email:em.value,password:pw.value,options:{emailRedirectTo:BASE+"account.html"}});msg.textContent=r.error?r.error.message:(r.data.session?"":T('confirm'));if(r.data?.session)show()}}
SB.auth.onAuthStateChange((e)=>{if(e==="SIGNED_IN")show()});show();
</script></body></html>
