(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();if(!session){app.innerHTML='<a class="btn" href="account.html">'+X("login")+'</a>';return}
const me=session.user.id;
async function draw(){const{data:fs}=await SB.from("friendships").select("*").order("created_at",{ascending:false});const ids=[...new Set((fs||[]).map(f=>f.requester_id===me?f.addressee_id:f.requester_id))];

const inc=(fs||[]).filter(f=>f.status==="pending"&&f.addressee_id===me),out=(fs||[]).filter(f=>f.status==="pending"&&f.requester_id===me),ok=(fs||[]).filter(f=>f.status==="accepted");

(inc.length?'<h3>'+X("req")+'</h3>'+inc.map(f=>'<div class="card">'+who(f.requester_id)+'<div style="margin-top:8px"><button data-a="ok" data-i="'+f.id+'">'+X("acc")+'</button> <button data-a="no" data-i="'+f.id+'" style="background:#ffffff1c;color:#f1efff">'+X("dec")+'</button></div></div>').join(""):"")+
'<h3>'+X("f")+' ('+ok.length+')</h3>'+(ok.map(f=>'<div class="card">'+who(other(f))+' <button data-a="no" data-i="'+f.id+'" style="float:inline-end;background:#ffffff1c;color:#f1efff">'+X("rm")+'</button></div>').join("")||'<p class="muted">'+X("none")+'</p>')+
(out.length?'<h3>'+X("pend")+'</h3>'+out.map(f=>'<div class="card">'+who(f.addressee_id)+' <button data-a="no" data-i="'+f.id+'" style="float:inline-end;background:#ffffff1c;color:#f1efff">&times;</button></div>').join(""):"");
