<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC review - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#2b2f9a66,transparent 55%),radial-gradient(ellipse at 90% 100%,#6d28d94d,transparent 55%),#070714;background-attachment:fixed;color:#f1efff;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#c4b5fd}h1{margin:.2em 0}input,textarea{background:#ffffff12;color:#f1efff;width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff1c;color:#f1efff}.card{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#070714}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body><p><a href="index.html">&larr; Rimaz</a> &middot; <a href="dashboard.html">Dashboard</a></p><h1>KYC review</h1><div id="app">...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const{data,error}=await SB.from("kyc").select("*").order("created_at",{ascending:false}).limit(50);
if(error||!data){app.textContent="Admin only.";return}
const rows=[];for(const k of data){const a=await SB.storage.from("kyc").createSignedUrl(k.id_path,300);const b=await SB.storage.from("kyc").createSignedUrl(k.selfie_path,300);
const st=(await SB.from("stores").select("handle,name").eq("owner_id",k.user_id).maybeSingle()).data;
rows.push('<div class="card"><b>'+esc(k.status)+'</b> <span class="muted">'+esc(k.user_id)+' &middot; '+esc(new Date(k.created_at).toLocaleString())+'</span>'+(st?'<p>@'+esc(st.handle)+'</p>':'')+'<div style="display:flex;gap:8px"><img src="'+esc(a.data?.signedUrl||"")+'" style="width:50%;border-radius:10px"><img src="'+esc(b.data?.signedUrl||"")+'" style="width:50%;border-radius:10px"></div>'+(k.status==="pending"?'<input class="nt" placeholder="note (optional)" maxlength="200"><button class="btn ap" data-u="'+k.user_id+'">Approve</button> <button class="btn alt rj" data-u="'+k.user_id+'" style="background:#ffffff1c;color:#f1efff">Reject</button>':'')+'</div>')}
app.innerHTML=rows.join("")||'<p class="muted">No requests.</p>';
app.onclick=async e=>{const b=e.target.closest(".ap,.rj");if(!b)return;const note=b.parentElement.querySelector(".nt").value.trim()||null;const r=await SB.from("kyc").update({status:b.classList.contains("ap")?"approved":"rejected",note}).eq("user_id",b.dataset.u);if(r.error){alert(r.error.message);return}location.reload()}})();
</script></body></html>
