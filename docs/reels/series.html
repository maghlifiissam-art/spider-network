<script src="i18n.js"></script><script src="common.js"></script><script>
const cinemaText={en:["Landscape films and series, separate from Reels. Original or licensed content only.","No films or series published yet.","Publish a film or episode","Could not load films and series. Please retry.","Retry"],fr:["Films et séries en format paysage, séparés des Reels. Contenu original ou sous licence uniquement.","Aucun film ni série publié pour le moment.","Publier un film ou un épisode","Impossible de charger les films et séries. Réessayez.","Réessayer"],ar:["أفلام ومسلسلات بالشاشة الأفقية، منفصلة عن الريلز. المحتوى الأصلي أو المرخّص فقط.","لا توجد أفلام أو مسلسلات منشورة بعد.","انشر فيلماً أو حلقة","تعذر تحميل الأفلام والمسلسلات. حاول مرة أخرى.","إعادة المحاولة"],es:["Películas y series en horizontal, separadas de Reels. Solo contenido original o con licencia.","Todavía no hay películas ni series.","Publicar película o episodio","No se pudo cargar. Inténtalo de nuevo.","Reintentar"],pt:["Filmes e séries na horizontal, separados dos Reels. Apenas conteúdo original ou licenciado.","Ainda não há filmes ou séries.","Publicar filme ou episódio","Não foi possível carregar. Tente novamente.","Tentar novamente"],de:["Filme und Serien im Querformat, getrennt von Reels. Nur eigene oder lizenzierte Inhalte.","Noch keine Filme oder Serien veröffentlicht.","Film oder Folge veröffentlichen","Laden fehlgeschlagen. Bitte erneut versuchen.","Erneut versuchen"],tr:["Yatay filmler ve diziler, Reels'ten ayrı. Yalnızca özgün veya lisanslı içerik.","Henüz film veya dizi yok.","Film veya bölüm yayınla","Yüklenemedi. Tekrar deneyin.","Tekrar dene"]};const CT=cinemaText[LANG]||cinemaText.en;document.getElementById("cinema-intro").textContent=CT[0];
const app=document.getElementById("app");const qs=new URLSearchParams(location.search);const id=qs.get("id");
async function report(pid){const reason=prompt(T("reason"));if(!reason)return;const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const r=await SB.from("reports").insert({post_id:pid,reporter_id:session.user.id,reason:reason.slice(0,500)});alert(r.error?r.error.message:T("reported"))}
(async()=>{
if(id){const{data:s}=await SB.from("series").select("*,channels(handle,name)").eq("id",id).maybeSingle();if(!s){app.textContent=T("noser");return}
const{data:eps}=await SB.from("posts").select("*").eq("series_id",id).order("season",{ascending:true}).order("episode",{ascending:true}).order("created_at",{ascending:true});
app.innerHTML='<p><a href="series.html">&larr; '+T("back")+'</a></p><h2>'+esc(s.title)+'</h2><div class="muted">'+(s.kind==="film"?T("sfilm"):T("sseries"))+' &middot; <a href="channel.html?h='+encodeURIComponent(s.channels?.handle||"")+'">@'+esc(s.channels?.handle)+'</a></div><p>'+esc(s.description)+'</p><h3>'+T("eps")+'</h3>'+
((eps||[]).map(p=>'<div class="card"><b>'+(s.kind==="film"?"":(T("season")+" "+(p.season||1)+" &middot; "+T("ep")+" "+(p.episode||1)))+(p.title?" "+esc(p.title):"")+'</b>'+(p.body?'<p style="white-space:pre-wrap">'+esc(p.body)+'</p>':'')+'<video controls playsinline preload="metadata" src="'+esc(p.media_url)+'"></video><button class="alt" data-r="'+p.id+'">'+T("report")+'</button></div>').join("")||'<p class="muted">'+T("noser")+'</p>');
app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>report(b.dataset.r));return}
const k=qs.get("k")||"all";
const{data:l,error}=await SB.from("series").select("*,channels(handle)").order("created_at",{ascending:false}).limit(60);
if(error)throw error;const list=(l||[]).filter(s=>k==="all"||s.kind===k);
app.innerHTML='<div class="filters">'+["all","series","film"].map(x=>'<a class="btn" style="'+(x===k?'':'background:#ffffff1c;color:#f1efff')+'" href="?k='+x+'">'+(x==="all"?T("all"):x==="film"?T("films"):T("series"))+'</a>').join("")+'</div><div class="catalog">'+
(list.map(s=>'<a href="?id='+s.id+'" style="text-decoration:none;color:#f1efff"><div class="card"><b>'+esc(s.title)+'</b><div class="muted">'+(s.kind==="film"?T("sfilm"):T("sseries"))+' &middot; @'+esc(s.channels?.handle)+'</div><div class="muted">'+esc((s.description||"").slice(0,120))+'</div></div></a>').join("")||'<div class="empty-cinema"><p>'+esc(CT[1])+'</p><a class="btn" href="publish.html?t=films">'+esc(CT[2])+'</a></div>')+'</div>'})().catch(()=>{app.innerHTML='<div class="empty-cinema"><p>'+esc(CT[3])+'</p><button id="retry-cinema">'+esc(CT[4])+'</button></div>';document.getElementById('retry-cinema').onclick=()=>location.reload()});
</script></body></html>
