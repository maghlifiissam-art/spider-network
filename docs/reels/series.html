const r=await SB.from("reports").insert({post_id:pid,reporter_id:session.user.id,reason:reason.slice(0,500)});alert(r.error?r.error.message:T("reported"))}
(async()=>{
if(id){const{data:s}=await SB.from("series").select("*,channels(handle,name)").eq("id",id).maybeSingle();if(!s){app.textContent=T("noser");return}
const{data:eps}=await SB.from("posts").select("*").eq("series_id",id).order("season",{ascending:true}).order("episode",{ascending:true}).order("created_at",{ascending:true});
app.innerHTML='<p><a href="series.html">&larr; '+T("back")+'</a></p><h2>'+esc(s.title)+'</h2><div class="muted">'+(s.kind==="film"?T("sfilm"):T("sseries"))+' &middot; <a href="channel.html?h='+encodeURIComponent(s.channels?.handle||"")+'">@'+esc(s.channels?.handle)+'</a></div><p>'+esc(s.description)+'</p><h3>'+T("eps")+'</h3>'+
((eps||[]).map(p=>'<div class="card"><b>'+(s.kind==="film"?"":(T("season")+" "+(p.season||1)+" &middot; "+T("ep")+" "+(p.episode||1)))+(p.title?" "+esc(p.title):"")+'</b>'+(p.body?'<p style="white-space:pre-wrap">'+esc(p.body)+'</p>':'')+'<div class="vw" style="background-image:url(\''+esc(p.poster_url||'')+'\')"><video controls playsinline preload="metadata" src="'+esc(p.media_url)+'" poster="'+esc(p.poster_url||'')+'"></video></div><button class="alt" data-r="'+p.id+'">'+T("report")+'</button></div>').join("")||'<p class="muted">'+T("noser")+'</p>');
document.querySelectorAll(".vw video").forEach(v=>{const f=()=>{if(v.videoHeight>v.videoWidth)v.closest(".vw").classList.add("vert")};if(v.readyState>=1)f();else v.addEventListener("loadedmetadata",f)});
app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>report(b.dataset.r));return}
const k=qs.get("k")||"all";const{data:l,error}=await SB.from("series").select("*,channels(handle)").order("created_at",{ascending:false}).limit(60);if(error)throw error;const{data:epsAll}=await SB.from("posts").select("id,title,series_id").not("series_id","is",null).order("created_at",{ascending:false}).limit(500);const epMap={};(epsAll||[]).forEach(p=>{if(p.series_id&&p.title)(epMap[p.series_id]=epMap[p.series_id]||[]).push(p.title)});const list=(l||[]).filter(s=>k==="all"||s.kind===k);

const QN={en:"No matches found.",fr:"Aucun r\u00e9sultat.",ar:"\u0644\u0627 \u0646\u062a\u0627\u0626\u062c \u0645\u0637\u0627\u0628\u0642\u0629.",es:"Sin resultados.",pt:"Sem resultados.",de:"Keine Treffer.",tr:"Sonu\u00e7 yok."};
app.innerHTML='<div class="filters">'+["all","series","film"].map(x=>'<a class="btn" style="'+(x===k?'':'background:#ffffff1c;color:#f1efff')+'" href="?k='+x+'">'+(x==="all"?T("all"):x==="film"?T("films"):T("series"))+'</a>').join("")+'</div><input id="cat-q" type="search" placeholder="'+esc(QH[LANG]||QH.en)+'" style="width:100%;box-sizing:border-box;margin:10px 0 12px;padding:11px 14px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff10;color:#f1efff;font-size:15px"><div class="catalog"></div>';
const render=q=>{const needle=(q||"").trim().toLowerCase();const shown=list.filter(s=>{if(!needle)return true;const hay=(s.title+" "+(s.description||"")).toLowerCase();if(hay.includes(needle))return true;return (epMap[s.id]||[]).some(t=>t.toLowerCase().includes(needle))});
document.querySelector(".catalog").innerHTML=shown.map(s=>{const match=needle&&!(s.title+" "+(s.description||"")).toLowerCase().includes(needle)?(epMap[s.id]||[]).find(t=>t.toLowerCase().includes(needle)):null;
return '<a href="?id='+s.id+'" style="text-decoration:none;color:#f1efff"><div class="card"><b>'+esc(s.title)+'</b><div class="muted">'+(s.kind==="film"?T("sfilm"):T("sseries"))+' &middot; @'+esc(s.channels?.handle)+'</div>'+(match?'<div class="muted">\u{1F3AC} '+esc(match)+'</div>':'')+'<div class="muted">'+esc((s.description||"").slice(0,120))+'</div></div></a>'}).join("")||'<div class="empty-cinema"><p>'+esc(needle?(QN[LANG]||QN.en):CT[1])+'</p>'+(needle?'' :'<a class="btn" href="publish.html?t=films">'+esc(CT[2])+'</a>')+'</div>'};
render("");document.getElementById("cat-q").addEventListener("input",e=>render(e.target.value));})().catch(()=>{app.innerHTML='<div class="empty-cinema"><p>'+esc(CT[3])+'</p><button id="retry-cinema">'+esc(CT[4])+'</button></div>';document.getElementById('retry-cinema').onclick=()=>location.reload()});
