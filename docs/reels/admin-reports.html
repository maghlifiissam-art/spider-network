(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const{data,error}=await SB.from("store_reports").select("*,stores(id,handle,name,suspended),store_items(title)").order("created_at",{ascending:false}).limit(60);
if(error||!data){location.replace("index.html");return}
app.innerHTML=data.map(r=>'<div class="card"><b>'+esc(r.status)+'</b> <span class="muted">'+esc(new Date(r.created_at).toLocaleString())+'</span><p>'+(r.stores?'<a href="store.html?h='+encodeURIComponent(r.stores.handle)+'">@'+esc(r.stores.handle)+'</a> '+esc(r.stores.name)+(r.stores.suspended?' <b style="color:#ff6b6b">'+X("susp")+'</b>':''):X("gone"))+(r.store_items?' &middot; '+esc(r.store_items.title):'')+'</p><p style="white-space:pre-wrap">'+esc(r.reason)+'</p>'+(r.stores?'<button class="btn su" data-s="'+r.stores.id+'" data-v="'+(r.stores.suspended?0:1)+'" data-r="'+r.id+'">'+(r.stores.suspended?X("uns"):X("sus"))+'</button> <button class="btn alt de" data-s="'+r.stores.id+'" style="background:#ffffff1c;color:#f1efff">'+X("del")+'</button> ':'')+'<button class="btn alt di" data-r="'+r.id+'" style="background:#ffffff1c;color:#f1efff">'+X("dis")+'</button></div>').join("")||'<p class="muted">'+X("none")+'</p>';
app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;let q;
if(b.classList.contains("su")){q=await SB.from("stores").update({suspended:b.dataset.v==="1"}).eq("id",b.dataset.s);if(!q.error)await SB.from("store_reports").update({status:"actioned"}).eq("id",b.dataset.r)}

if(q&&q.error){alert(q.error.message);return}location.reload()}})();

(async()=>{const cr=document.getElementById("cr");const lg=localStorage.getItem("lang")||"en";const D={en:{h:"Content reports",none:"No open content reports.",rm:"Remove content",bl:"Remove + block user",di:"Dismiss",gone:"(content already removed)",cat:{harmful:"Harmful content",policy:"Policy violation",spam:"Spam",hacking:"Hacking or scam",other:"Other"},ty:{post:"Post",mention:"Mention",comment:"Comment"},cf:"Confirm?"},fr:{h:"Signalements de contenu",none:"Aucun signalement ouvert.",rm:"Supprimer le contenu",bl:"Supprimer + bloquer l'utilisateur",di:"Ignorer",gone:"(contenu déjà supprimé)",cat:{harmful:"Contenu nuisible",policy:"Violation des règles",spam:"Spam",hacking:"Piratage ou arnaque",other:"Autre"},ty:{post:"Publication",mention:"Mention",comment:"Commentaire"},cf:"Confirmer ?"},ar:{h:"بلاغات المحتوى",none:"لا توجد بلاغات محتوى مفتوحة.",rm:"حذف المحتوى",bl:"حذف + حظر المستخدم",di:"تجاهل",gone:"(المحتوى محذوف أصلاً)",cat:{harmful:"محتوى ضار",policy:"مخالفة لسياسة المنصة",spam:"سبام",hacking:"اختراق أو احتيال",other:"أخرى"},ty:{post:"منشور",mention:"إشارة",comment:"تعليق"},cf:"تأكيد؟"}};const Y=D[lg]||D.en;
const{data,error}=await SB.from("content_reports").select("*").eq("status","open").order("created_at",{ascending:false}).limit(60);if(error||!data)return;
const tb={post:["posts","title,body"],mention:["channel_mentions","body"],comment:["post_comments","body"]};const pv={};for(const r of data){const[t,c]=tb[r.target_type];const q=await SB.from(t).select(c).eq("id",r.target_id).maybeSingle();pv[r.id]=q.data?(q.data.title?q.data.title+" - ":"")+(q.data.body||""):null}
cr.innerHTML='<h2>'+Y.h+'</h2>'+(data.map(r=>'<div class="card"><b>'+esc(Y.ty[r.target_type])+' &middot; '+esc(Y.cat[r.category]||r.category)+'</b> <span class="muted">'+esc(new Date(r.created_at).toLocaleString())+'</span><p style="white-space:pre-wrap">'+(pv[r.id]?esc(pv[r.id].slice(0,300)):Y.gone)+'</p>'+(r.details?'<p class="muted" style="white-space:pre-wrap">'+esc(r.details)+'</p>':'')+'<button class="btn crm" data-r="'+r.id+'" data-a="remove">'+Y.rm+'</button><button class="btn crm" data-r="'+r.id+'" data-a="block">'+Y.bl+'</button><button class="btn alt crm" data-r="'+r.id+'" data-a="dismiss" style="background:#ffffff1c;color:#f1efff">'+Y.di+'</button></div>').join("")||'<p class="muted">'+Y.none+'</p>');
cr.onclick=async e=>{const b=e.target.closest(".crm");if(!b)return;if(b.dataset.a==="block"&&!confirm(Y.cf))return;const q=await SB.rpc("moderate_report",{p_id:b.dataset.r,p_action:b.dataset.a});if(q.error){alert(q.error.message);return}location.reload()}})();

(async()=>{const bl=document.getElementById("bl");const lg=localStorage.getItem("lang")||"en";const D={en:{h:"Blocked users",none:"No blocked users.",un:"Unblock",cf:"Unblock this user?",u:"user"},fr:{h:"Utilisateurs bloqués",none:"Aucun utilisateur bloqué.",un:"Débloquer",cf:"Débloquer cet utilisateur ?",u:"utilisateur"},ar:{h:"المستخدمون المحظورون",none:"لا يوجد مستخدمون محظورون.",un:"إلغاء الحظر",cf:"إلغاء حظر هذا المستخدم؟",u:"مستخدم"}};const Z=D[lg]||D.en;
