<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eyasbfywyatrkpkljxek.supabase.co; media-src 'self' blob: https://eyasbfywyatrkpkljxek.supabase.co; connect-src https://eyasbfywyatrkpkljxek.supabase.co; frame-src https://meet.jit.si; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports - Rimaz</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#2b2f9a66,transparent 55%),radial-gradient(ellipse at 90% 100%,#6d28d94d,transparent 55%),#070714;background-attachment:fixed;color:#f1efff;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}a{color:#c4b5fd}h1{margin:.2em 0}input,textarea{background:#ffffff12;color:#f1efff;width:100%;padding:12px;border-radius:12px;border:0;margin:6px 0;font-size:16px}button,.btn{background:#d4a017;color:#2e1065;border:0;padding:11px 18px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}button.alt{background:#ffffff1c;color:#f1efff}.card{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:14px;padding:14px;margin:10px 0}video{width:100%;border-radius:12px;margin:8px 0;background:#070714}.muted{opacity:.7;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head><body><p><a href="index.html">&larr; Rimaz</a> &middot; <a href="dashboard.html">Dashboard</a></p><h1>Store reports</h1><div id="app">...</div>
<script src="i18n.js"></script><script src="common.js"></script><script>
(async()=>{const app=document.getElementById("app");const{data:{session}}=await SB.auth.getSession();if(!session){location.href="account.html";return}
const{data,error}=await SB.from("store_reports").select("*,stores(id,handle,name,suspended),store_items(title)").order("created_at",{ascending:false}).limit(60);
if(error||!data){app.textContent="Admin only.";return}
app.innerHTML=data.map(r=>'<div class="card"><b>'+esc(r.status)+'</b> <span class="muted">'+esc(new Date(r.created_at).toLocaleString())+'</span><p>'+(r.stores?'<a href="store.html?h='+encodeURIComponent(r.stores.handle)+'">@'+esc(r.stores.handle)+'</a> '+esc(r.stores.name)+(r.stores.suspended?' <b style="color:#ff6b6b">(suspended)</b>':''):'(store deleted)')+(r.store_items?' &middot; '+esc(r.store_items.title):'')+'</p><p style="white-space:pre-wrap">'+esc(r.reason)+'</p>'+(r.stores?'<button class="btn su" data-s="'+r.stores.id+'" data-v="'+(r.stores.suspended?0:1)+'" data-r="'+r.id+'">'+(r.stores.suspended?'Unsuspend':'Suspend store')+'</button> <button class="btn alt de" data-s="'+r.stores.id+'" style="background:#ffffff1c;color:#f1efff">Delete store</button> ':'')+'<button class="btn alt di" data-r="'+r.id+'" style="background:#ffffff1c;color:#f1efff">Dismiss</button></div>').join("")||'<p class="muted">No reports.</p>';
app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;let q;
if(b.classList.contains("su")){q=await SB.from("stores").update({suspended:b.dataset.v==="1"}).eq("id",b.dataset.s);if(!q.error)await SB.from("store_reports").update({status:"actioned"}).eq("id",b.dataset.r)}
else if(b.classList.contains("de")){if(!confirm("Delete this store and all its products?"))return;q=await SB.from("stores").delete().eq("id",b.dataset.s)}
else if(b.classList.contains("di")){q=await SB.from("store_reports").update({status:"dismissed"}).eq("id",b.dataset.r)}
if(q&&q.error){alert(q.error.message);return}location.reload()}})();
</script></body></html>
